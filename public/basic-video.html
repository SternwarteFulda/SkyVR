<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Video Streaming Example — Networked-Aframe</title>
    <meta name="description" content="Video Streaming Example — Networked-Aframe" />

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/easyrtc/easyrtc.js"></script>
    <script src="/js/networked-aframe/networked-aframe.min.js"></script>

    <script>
        // DETERMINE IF WE SHOULD CAPTURE CAMERA
        const urlParams = new URL(window.location.href).searchParams;
        const shouldCapture = urlParams.get('capture') !== 'false';

        // HACK: Hook EasyRTC to prevent local video capture while keeping NAF video subsystem "on"
        // This allows us to receive video without sharing our own camera.
        const originalEnableVideo = easyrtc.enableVideo;
        easyrtc.enableVideo = function (val) {
            if (!shouldCapture && val === true) {
                console.log("Blocking NAF's attempt to enable local video capture (Avatar Mode).");
                return originalEnableVideo.call(easyrtc, false);
            }
            return originalEnableVideo.apply(easyrtc, arguments);
        };

        // NAF schema setup
        NAF.schemas.getComponentsOriginal = NAF.schemas.getComponents;
        NAF.schemas.getComponents = (template) => {
            if (!NAF.schemas.hasTemplate('#avatar-template')) {
                NAF.schemas.add({
                    template: '#avatar-template',
                    components: [
                        {
                            component: 'position',
                            requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
                        },
                        {
                            component: 'rotation',
                            requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
                        }
                    ]
                });
            }
            const components = NAF.schemas.getComponentsOriginal(template);
            return components;
        };
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/aframe-randomizer-components@3.0.2/dist/aframe-randomizer-components.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
    <script src="components/spawn-in-circle.component.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>

<body>
    <a-scene networked-scene="
      room: basic-video;
      debug: true;
      adapter: easyrtc;
      audio: true;
      video: true;
    ">
        <a-assets>
            <template id="avatar-template">
                <a-entity class="avatar">
                    <a-entity networked-audio-source></a-entity>
                    <a-plane color="#FFF" width="4" height="3" position="0 .6 0" material="side: front"
                        networked-video-source></a-plane>
                    <a-plane color="#FFF" width="4" height="3" position="0 .6 0" material="side: back"
                        networked-video-source></a-plane>
                </a-entity>
            </template>
        </a-assets>

        <a-entity id="rig">
            <a-entity id="player" networked="template:#avatar-template;attachTemplateToLocal:false;" camera
                position="0 1.6 0" spawn-in-circle="radius:3" wasd-controls look-controls>
                <a-sphere class="head" visible="false" random-color></a-sphere>
            </a-entity>
        </a-entity>

        <a-entity environment="preset:arches"></a-entity>
    </a-scene>

    <div class="actions">
        <button id="camera-btn" type="button" class="button">Hide Camera</button>
    </div>

    <script>
        // Camera status
        let cameraEnabled = true;
        const cameraBtnEle = document.getElementById('camera-btn');

        function onConnect() {
            console.log('onConnect', new Date());
            cameraBtnEle.addEventListener('click', function () {
                NAF.connection.adapter.enableCamera(!cameraEnabled);
                cameraEnabled = !cameraEnabled;
                cameraBtnEle.textContent = cameraEnabled ? 'Hide Camera' : 'Show Camera';
            });
        }
    </script>
</body>

</html>
