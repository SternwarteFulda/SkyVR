<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyVR Lobby - Enter the Portal</title>
    <link rel="stylesheet" type="text/css" href="/css/fonts.css" />
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #4b0082;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #050510 url('assets/cosmic_background.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
        }

        /* Ambient overlay to darken the background slightly */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 0;
        }

        .lobby-card {
            position: relative;
            z-index: 1;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 32px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        h1 {
            font-weight: 600;
            font-size: 3rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            opacity: 0.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 1.8rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }

        .color-picker-label {
            margin-top: 1rem;
        }

        .color-picker {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .color-option {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .color-option:hover {
            transform: scale(1.25);
        }

        .color-option.selected {
            border-color: white;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .btn-join {
            width: 100%;
            padding: 18px;
            margin-top: 2.5rem;
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-join::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .btn-join:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.6);
        }

        .btn-join:hover::after {
            opacity: 1;
        }

        .btn-join:active {
            transform: translateY(-1px);
        }

        /* Micro-animations */
        .color-option {
            animation: popIn 0.5s backwards;
        }

        .color-option:nth-child(1) {
            animation-delay: 0.1s;
        }

        .color-option:nth-child(2) {
            animation-delay: 0.15s;
        }

        .color-option:nth-child(3) {
            animation-delay: 0.2s;
        }

        .color-option:nth-child(4) {
            animation-delay: 0.25s;
        }

        .color-option:nth-child(5) {
            animation-delay: 0.3s;
        }

        .color-option:nth-child(6) {
            animation-delay: 0.35s;
        }

        .color-option:nth-child(7) {
            animation-delay: 0.4s;
        }

        .color-option:nth-child(8) {
            animation-delay: 0.45s;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered:', registration.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</head>

<body>
    <div class="lobby-card">
        <h1>SkyVR</h1>
        <div class="subtitle">Observation Portal</div>

        <div class="input-group">
            <label for="room-id">Room Channel</label>
            <input type="text" id="room-id" placeholder="e.g. 1984 or sky-vr-01" value="">
        </div>

        <div class="input-group">
            <label for="username">Observer Identity</label>
            <input type="text" id="username" placeholder="Enter nametag">
        </div>

        <div class="input-group">
            <label class="color-picker-label">Avatar Core Signature</label>
            <div class="color-picker" id="color-picker">
                <!-- Colors injected by JS -->
            </div>
            <input type="hidden" id="selected-color" value="#ff4444">
        </div>

        <button class="btn-join" onclick="joinSession()">Beitreten</button>
    </div>

    <script>
        const colors = [
            '#ff4444', '#ff8800', '#ffd700', '#00ffaa',
            '#00d4ff', '#3b82f6', '#8b5cf6', '#d946ef'
        ];

        const colorPicker = document.getElementById('color-picker');
        const colorInput = document.getElementById('selected-color');
        const urlParams = new URLSearchParams(window.location.search);

        // Sanitization function for room and name parameters
        function sanitizeRoomName(value) {
            if (!value) return null;
            return value.toLowerCase().replace(/[^a-z0-9-]/g, '').substring(0, 16);
        }

        function sanitizePlayerName(value) {
            if (!value) return null;
            return value.replace(/[^a-zA-Z0-9- ]/g, '').substring(0, 20);
        }

        // Get raw URL parameters
        const roomParamRaw = urlParams.get('room');
        const nameParamRaw = urlParams.get('name');

        // Sanitize URL parameters
        const roomInit = sanitizeRoomName(roomParamRaw) || localStorage.getItem('skyvr_room');
        let nameInit = sanitizePlayerName(nameParamRaw) || localStorage.getItem('skyvr_name');

        // Force-clear the old "Anonymous" fallback if it exists in storage or URL
        if (nameInit === 'Anonymous') nameInit = null;

        const colorInitRaw = urlParams.get('color') || localStorage.getItem('skyvr_color');
        const colorInit = colorInitRaw ? decodeURIComponent(colorInitRaw) : null;

        // Check if URL parameters were modified by sanitization and show warning
        let warningMessages = [];

        if (roomParamRaw && sanitizeRoomName(roomParamRaw) !== roomParamRaw) {
            warningMessages.push('Room name contained invalid characters and was corrected.');
        }

        if (nameParamRaw && sanitizePlayerName(nameParamRaw) !== nameParamRaw) {
            warningMessages.push('Player name contained invalid characters and was corrected.');
        }

        if (roomParamRaw && roomParamRaw.length > 16) {
            warningMessages.push('Room name was too long and was shortened.');
        }

        if (nameParamRaw && nameParamRaw.length > 20) {
            warningMessages.push('Player name was too long and was shortened.');
        }

        if (warningMessages.length > 0) {
            const warningMsg = 'URL Parameter Warnings:\n\n' +
                warningMessages.join('\n') +
                '\n\nRoom names: lowercase letters (a-z), numbers (0-9), and hyphens (-), max 16 chars.\n' +
                'Player names: letters (A-Z, a-z), numbers (0-9), hyphens (-), and spaces, max 20 chars.';
            alert(warningMsg);
        }

        // Generate random 4-digit room number if no room has been set before
        if (roomInit) {
            document.getElementById('room-id').value = roomInit;
        } else {
            const randomRoomNumber = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('room-id').value = randomRoomNumber;
        }

        // Validate and sanitize room input
        const roomInput = document.getElementById('room-id');
        roomInput.addEventListener('input', function (e) {
            let value = e.target.value;
            // Convert to lowercase and remove invalid characters (only allow a-z, 0-9, and -)
            value = value.toLowerCase().replace(/[^a-z0-9-]/g, '');
            // Restrict to 16 characters
            if (value.length > 16) {
                value = value.substring(0, 16);
            }
            e.target.value = value;
        });

        // Validate and sanitize name input
        const nameInput = document.getElementById('username');
        nameInput.addEventListener('input', function (e) {
            let value = e.target.value;
            // Remove invalid characters (only allow a-z, A-Z, 0-9, -, and space)
            value = value.replace(/[^a-zA-Z0-9- ]/g, '');
            // Restrict to 20 characters
            if (value.length > 20) {
                value = value.substring(0, 20);
            }
            e.target.value = value;
        });

        colors.forEach((color, index) => {
            const isSelected = colorInit ? (color.toLowerCase() === colorInit.toLowerCase()) : (index === 0);
            const div = document.createElement('div');
            div.className = 'color-option' + (isSelected ? ' selected' : '');
            div.style.backgroundColor = color;
            if (isSelected) colorInput.value = color;

            div.onclick = () => {
                document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                div.classList.add('selected');
                colorInput.value = color;
                localStorage.setItem('skyvr_color', color);
            };
            colorPicker.appendChild(div);
        });

        // Set name (from params or random)
        if (nameInit) {
            document.getElementById('username').value = nameInit;
            localStorage.setItem('skyvr_name', nameInit);
        } else {
            const prefix = ['Nebula', 'Solar', 'Lunar', 'Astral', 'Cosmos', 'Nova', 'Pulsar', 'Zenith'];
            const suffix = ['Seeker', 'Sage', 'Watcher', 'Pilot', 'Nomad', 'Explorer'];
            const randomName = prefix[Math.floor(Math.random() * prefix.length)] + ' ' + suffix[Math.floor(Math.random() * suffix.length)] + ' ' + Math.floor(Math.random() * 99);
            document.getElementById('username').value = randomName;
        }

        function joinSession() {
            let room = document.getElementById('room-id').value || '';
            let name = document.getElementById('username').value || '';
            const color = colorInput.value;

            // Sanitize room name (ensure it follows validation rules)
            room = sanitizeRoomName(room);

            // Generate random 4-digit number if room is empty after sanitization
            if (!room) {
                room = Math.floor(1000 + Math.random() * 9000).toString();
            }

            // Sanitize player name (ensure it follows validation rules)
            name = sanitizePlayerName(name);

            // Use fallback if name is empty after sanitization
            if (!name) {
                name = 'observer-' + Math.floor(Math.random() * 9999);
            }

            // Persist to localStorage
            localStorage.setItem('skyvr_room', room);
            localStorage.setItem('skyvr_name', name);
            localStorage.setItem('skyvr_color', color);

            const encodedColor = encodeURIComponent(color);

            // Redirect to main skyvr page
            window.location.href = `./?room=${room}&name=${encodeURIComponent(name)}&color=${encodedColor}`;
        }

        // Add keyboard support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinSession();
        });
    </script>
</body>

</html>
