<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/easyrtc/easyrtc.js"></script>
  <script src="https://unpkg.com/networked-aframe@^0.14.0/dist/networked-aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('sky-state', {
      schema: {
        time: { type: 'string', default: '' },
        latitude: { type: 'number', default: 50.5 },
        longitude: { type: 'number', default: 9.7 },
        showMeridian: { type: 'boolean', default: false },
        showEquator: { type: 'boolean', default: false },
        showEcliptic: { type: 'boolean', default: false },
        showCardinalPoints: { type: 'boolean', default: true },
        showCelestialPoles: { type: 'boolean', default: false }
      },
      update: function (oldData) {
        if (typeof luxon === 'undefined') return;

        if (this.data.time && this.data.time !== oldData.time) {
          window.simulationTime = luxon.DateTime.fromISO(this.data.time);
          console.log("Sky State Received: Time updated to", this.data.time);
        }
        if (this.data.latitude !== undefined && this.data.latitude !== oldData.latitude) {
          window.latitude = this.data.latitude;
          console.log("Sky State Received: Latitude updated to", this.data.latitude);
        }
        if (this.data.longitude !== undefined && this.data.longitude !== oldData.longitude) {
          window.longitude = this.data.longitude;
          console.log("Sky State Received: Longitude updated to", this.data.longitude);
        }

        const guides = {
          'meridian': this.data.showMeridian,
          'equator': this.data.showEquator,
          'ecliptic': this.data.showEcliptic,
          'cardinal-points': this.data.showCardinalPoints,
          'ncp': this.data.showCelestialPoles,
          'ncp_glow': this.data.showCelestialPoles,
          'scp': this.data.showCelestialPoles,
          'scp_glow': this.data.showCelestialPoles
        };

        for (let id in guides) {
          let el = document.getElementById(id);
          if (el) el.setAttribute('visible', guides[id]);
        }

        if (typeof updateScene === 'function') {
          updateScene();
        }
      }
    });

    // see issue https://github.com/networked-aframe/networked-aframe/issues/267
    NAF.schemas.getComponentsOriginal = NAF.schemas.getComponents;
    NAF.schemas.getComponents = (template) => {
      if (!NAF.schemas.hasTemplate('#rig-template')) {
        NAF.schemas.add({
          template: '#rig-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#camera-template')) {
        NAF.schemas.add({
          template: '#camera-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            },
            'player-info'
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#right-controller-template')) {
        NAF.schemas.add({
          template: '#right-controller-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            },
            {
              selector: '.pointer',
              component: 'visible'
            },
            {
              selector: '.pointer',
              component: 'position'
            },
            {
              selector: '.pointer',
              component: 'rotation'
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#sky-template')) {
        NAF.schemas.add({
          template: '#sky-template',
          components: ['sky-state']
        });
      }
      if (!NAF.schemas.hasTemplate('#drawing-stroke-template')) {
        NAF.schemas.add({
          template: '#drawing-stroke-template',
          components: [
            'drawing-stroke'
          ]
        });
      }
      const components = NAF.schemas.getComponentsOriginal(template);
      return components;
    };

    // Parse URL parameters for room, name, and color
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    const nameParam = urlParams.get('name');
    const colorParam = urlParams.get('color');

    window.getLobbyParams = function () {
      const camera = document.getElementById('camera');
      const room = roomParam || '1234';
      let name = nameParam || 'Anonymous';
      let color = colorParam || '#ff4444';

      if (camera && camera.components['player-info']) {
        const data = camera.components['player-info'].data;
        name = data.name || name;
        color = data.color || color;
      }

      return `?room=${room}&name=${encodeURIComponent(name)}&color=${encodeURIComponent(color)}`;
    };

    // If no room is specified, redirect to lobby
    if (!roomParam && !window.location.search.includes('no-redirect')) {
      window.location.href = 'lobby.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.getElementById('camera');

      if (sceneEl && roomParam) {
        sceneEl.setAttribute('networked-scene', 'room', roomParam);
      }

      if (cameraEl) {
        if (nameParam) cameraEl.setAttribute('player-info', 'name', nameParam);
        if (colorParam) {
          const color = colorParam.startsWith('#') ? colorParam : '#' + colorParam;
          cameraEl.setAttribute('player-info', 'color', color);
        }
      }
    });

    window.onConnect = function () {
      console.log('onConnect', new Date());
      updateLoadingIndicator('network', true);
      const micBtnEle = document.getElementById('mic-btn');
      if (typeof NAF !== 'undefined' && NAF.connection && NAF.connection.adapter) {
        NAF.connection.adapter.enableMicrophone(false);
        window.micEnabled = false;
        if (micBtnEle) micBtnEle.textContent = 'Unmute Mic';
      }
    };

  </script>
  <script src="js/astronomy.browser.min.js"></script>
  <script src="js/luxon.min.js"></script>
  <script src="js/custom-fogless-text.js"></script>
  <script src="components/skyvr-player-info-component.js"></script>
  <script src="components/skyvr-drawing-component.js"></script>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <script>
    window.loadingStatus = {
      assets: false,
      network: false,
      stars: false
    };

    function updateLoadingIndicator(type, status) {
      window.loadingStatus[type] = status;
      const item = document.getElementById(`status-${type}`);
      if (item) {
        if (status) {
          item.classList.remove('active');
          item.classList.add('complete');
          item.querySelector('.icon').textContent = '✓';

          if (type === 'network') {
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room') || 'default';
            item.querySelector('.label').textContent = `Connected to Room: ${room}`;
          } else if (type === 'assets') {
            item.querySelector('.label').textContent = 'Modules Ready';
          } else if (type === 'stars') {
            item.querySelector('.label').textContent = 'Star Map Processed';
          }
        } else {
          item.classList.add('active');
          item.querySelector('.icon').textContent = '○';
        }
      }

      if (window.loadingStatus.assets && window.loadingStatus.network && window.loadingStatus.stars) {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.classList.add('fade-out');
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 1000);
        }
      }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('SW registered:', registration.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</head>

<body>
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="spinner"></div>
      <h1 class="loading-title">SkyVR</h1>
      <ul class="status-list">
        <li id="status-assets" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Preloading Assets...</span>
        </li>
        <li id="status-network" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Connecting to Network...</span>
        </li>
        <li id="status-stars" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Downloading Star Data (35MB)...</span>
        </li>
      </ul>

    </div>
  </div>


  <a-scene loading-screen="enabled: false" high-res renderer="

      antialias: true;
      highRefreshRate: true;
      foveationLevel: 0.3" environment="
      active: true;
      preset: none;
      seed: 0;
      skyType: atmosphere;
      skyColor: #88c;
      horizonColor: #ddd;
      lighting: none;
      lightPosition: 300 0 300;
      fog: 0.75;
      flatShading: false;
      playArea: 1;
      ground: hills;
      groundYScale: 8;
      groundTexture: none;
      groundColor: #553e35;
      groundColor2: #694439;
      dressing: none;
      dressingAmount: 100;
      dressingColor: #795449;
      dressingScale: 5;
      dressingVariance: 1 1 1;
      dressingUniformScale: true;
      grid: crosses;
      dressingOnPlayArea: 0;
      gridColor: #39d2f2;
      shadow: false" networked-scene="
      room: basic-audio;
      debug: true;
      adapter: easyrtc;
      audio: true;
      onConnect: onConnect;">

    <a-assets timeout="60000">

      <!-- Templates -->
      <!-- Avatar -->
      <template id="rig-template">
        <a-entity class="avatar-rig"></a-entity>
      </template>
      <template id="camera-template">
        <a-entity class="avatar-camera" networked-audio-source>
          <a-sphere class="head" scale="0.2 0.22 0.2"></a-sphere>
          <a-entity class="face" position="0 0.05 0">
            <a-sphere class="eye" color="#efefef" position="0.06 0.05 -0.16" scale="0.04 0.04 0.04">
              <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
            </a-sphere>
            <a-sphere class="eye" color="#efefef" position="-0.06 0.05 -0.16" scale="0.04 0.04 0.04">
              <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
            </a-sphere>
          </a-entity>

          <!-- here we add a text component for a nametag; the value will be updated by the player-info component -->
          <a-text class="nametag" value="?" rotation="0 180 0" position=".25 -.35 0" side="double"
            scale=".5 .5 .5"></a-text>
        </a-entity>
      </template>
      <template id="right-controller-template">
        <a-entity>
          <a-entity class="pointer" position="0 0.005 0"
            bottom-origin-cylinder="height: 394; radius: 0.009; color: red; rotation: 54 9 0; opacity: 0.6;"
            visible="false">
          </a-entity>
        </a-entity>
      </template>
      <template id="sky-template">
        <a-entity></a-entity>
      </template>
      <template id="drawing-stroke-template">
        <a-entity drawing-stroke></a-entity>
      </template>
      <!-- /Templates -->

      <img id="starTexture" src="assets/star.png">
      <img id="gaia" src="assets/gaia.png">
      <img id="halo" src="assets/halo.png">
      <img id="moon-map" src="assets/lroc_color_poles_1k.jpg">
      <img id="moon-bump" src="assets/ldem_3_8bit.jpg">

      <!-- UI Icons -->
      <img id="icon-door" src="assets/icons/door.svg">
      <img id="icon-mic-on" src="assets/icons/mic-on.svg">
      <img id="icon-mic-off" src="assets/icons/mic-off.svg">
      <img id="icon-draw" src="assets/icons/draw.svg">
      <img id="icon-stamp" src="assets/icons/stamp.svg">
      <img id="icon-sticky" src="assets/icons/sticky.svg">
      <img id="icon-constellation" src="assets/icons/constellation.svg">

      <script src="components/aframe-environment-component.js"></script>
      <script src="components/aframe-extras.primitives.min.js"></script>
      <script src="components/spawn-in-circle.component.js"></script>
      <script src="components/skyvr-high-res-component.js"></script>
      <script src="components/skyvr-starfield-component.js"></script>
      <script src="components/skyvr-cylinder-component.js"></script>
      <script src="components/skyvr-rounded-component.js"></script>
      <script src="components/skyvr-glow-effect-component.js"></script>
      <script src="components/skyvr-control-panel-component.js"></script>
      <script src="components/skyvr-switch-component.js"></script>
      <script src="components/skyvr-rig-follower-component.js"></script>
      <script src="components/skyvr-infobar-component.js"></script>
      <script src="components/skyvr-tooltip-component.js"></script>
    </a-assets>

    <a-entity id="sky-master" networked="template:#sky-template;persistent:true;networkId:sky-master"
      sky-state></a-entity>


    <!-- <a-entity light="type: ambient; color: #aaa"></a-entity> -->
    <!-- <a-entity light="type: hemisphere; color: #000; groundcolor: #aaa" position="0 0.01 0"></a-entity> -->

    <!-- <a-ocean width="800" depth="800" density="400" opacity="1" position="0 0 0"></a-ocean> -->

    <!-- Camera with Meta Quest-Controller components and laser-controls -->
    <a-entity id="camera-rig" rig-follower networked="template:#rig-template;attachTemplateToLocal:false;"
      spawn-in-circle="radius:3" position="0 0 0" rotation="0 0 0">
      <a-entity id="camera" player-info networked="template:#camera-template;attachTemplateToLocal:false;"
        camera="near: 0.1; far: 3600" look-controls position="0 1.6 0">
        <a-sphere class="head" visible="false" random-color></a-sphere>
      </a-entity>
      <!-- Infobar placed in front of user, visible when looking down -->
      <a-entity id="infobar" skyvr-infobar position="0 0.8 -0.6" rotation="-40 0 0"></a-entity>
      <a-entity id="right-controller" networked="template:#right-controller-template;attachTemplateToLocal:false;"
        material="shader: flat" meta-touch-controls="hand: right" laser-controls
        raycaster="objects: [data-raycastable]; far: 5; lineOpacity: 0.5;" drawing>
        <!-- Coordinate system for the right controller -->
        <a-entity>
          <!-- X-Axis (Red) -->
          <a-entity line="start: 0 0 0; end: 0.1 0 0; color: red;"></a-entity>
          <!-- Y-Axis (Green) -->
          <a-entity line="start: 0 0 0; end: 0 0.1 0; color: green;"></a-entity>
          <!-- Z-Axis (Blue) -->
          <a-entity line="start: 0 0 0; end: 0 0 0.1; color: blue;"></a-entity>
        </a-entity>
        <!-- Pointer -->
        <a-entity id="pointer" class="pointer" position="0 0.005 0"
          bottom-origin-cylinder="height: 394; radius: 0.009; color: red; rotation: 54 9 0; opacity: 0.6;"
          visible="false">
        </a-entity>

        <!-- Controller Hints -->
        <a-entity id="hint-trigger" class="controller-hint" position="0 -0.03 -0.05" rotation="-130 0 0">
          <a-rounded width="0.12" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.06 -0.0125 0"></a-rounded>
          <a-text value="Select" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0 0.02 0.03; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-right-joy" class="controller-hint" position="0.04 0.03 -0.01" rotation="-120 0 0">
          <a-rounded width="0.10" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Rotate" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.01 0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-right-grip" class="controller-hint" position="0.06 0 0.08" rotation="-90 90 0">
          <a-rounded width="0.14" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.07 -0.0125 0"></a-rounded>
          <a-text value="Show Pointer" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: -0.02 0 -0.02; end: -0.05 0 -0.05; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-a" class="controller-hint" position="-0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.1" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Remove (A)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-b" class="controller-hint" position="0.02 0.08 0.02" rotation="-120 0 0">
          <a-rounded id="hint-b-bg" width="0.2" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.1 -0.0125 0"></a-rounded>
          <a-text id="hint-b-text" value="Action (B)" width="0.25" align="center" color="white"
            position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.03 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>
      </a-entity>
      <a-entity id="left-controller" meta-touch-controls="hand: left" position="0 0 0">
        <!-- Controller Hints -->
        <a-entity id="hint-x" class="controller-hint" position="-0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.1" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Menu (X)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-y" class="controller-hint" position="0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.11" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.055 -0.0125 0"></a-rounded>
          <a-text value="Mode (Y)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-grip" class="controller-hint" position="-0.06 0 0.08" rotation="-90 -90 0">
          <a-rounded width="0.13" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.065 -0.0125 0"></a-rounded>
          <a-text value="Talk (Grip)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0.02 0 -0.02; end: 0.05 0 -0.05; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-left-joy" class="controller-hint" position="0 0.06 -0.02" rotation="-120 0 0">
          <a-rounded width="0.08" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.04 -0.0125 0"></a-rounded>
          <a-text value="Time" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0 -0.02 0.02; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-control-panel id="control-panel-1" enabled="false" height="0.5">
          <a-entity id="latitude-display" position="0 0.22 0"></a-entity>
          <a-entity id="longitude-display" position="0 0.14 0"></a-entity>
          <a-entity id="date-time-display" position="0 0.02 0"></a-entity>

          <!-- buttons on the control panel -->
          <a-entity id="switch-hints"
            switch="position: -0.05 0.21 0; clickActionParam: toggleHints; toggled: true"></a-entity>
          <a-text value="Controller Tooltips" position="-0.03 0.21 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-meridian" switch="position: -0.05 0.18 0; clickActionParam: toggleMeridian"></a-entity>
          <a-text value="Meridian" position="-0.03 0.18 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-equator" switch="position: -0.05 0.15 0; clickActionParam: toggleEquator"></a-entity>
          <a-text value="Equator" position="-0.03 0.15 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-ecliptic" switch="position: -0.05 0.12 0; clickActionParam: toggleEcliptic"></a-entity>
          <a-text value="Ecliptic" position="-0.03 0.12 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-cardinal-points"
            switch="position: -0.05 0.09 0; clickActionParam: toggleCardinalPoints; toggled: true"></a-entity>
          <a-text value="Cardinal Points" position="-0.03 0.09 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-ncp" switch="position: -0.05 0.06 0; clickActionParam: toggleNCP"></a-entity>
          <a-text value="Celestial Poles" position="-0.03 0.06 0" width="0.2" color="white" align="left"></a-text>

          <!-- Coordinates adjusters -->
          <a-text value="Lat" position="-0.15 0.22 0" width="0.3" color="white" align="left"></a-text>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="-0.06 0.22 0.001" color="#444"
            text="value: -; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('latitude', -0.1)"></a-rounded>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="0.02 0.22 0.001" color="#444"
            text="value: +; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('latitude', 0.1)"></a-rounded>

          <a-text value="Lon" position="-0.15 0.14 0" width="0.3" color="white" align="left"></a-text>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="-0.06 0.14 0.001" color="#444"
            text="value: -; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('longitude', -0.1)"></a-rounded>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="0.02 0.14 0.001" color="#444"
            text="value: +; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('longitude', 0.1)"></a-rounded>

          <!-- Date/Time adjusters -->
          <a-rounded id="now-button" width="0.08" height="0.03" radius="0.01" position="0.09 0.02 0.001" color="#222"
            text="value: NOW; align: center; width: 0.5" class="control-panel-button" data-raycastable

          <a-text value="Year" position="-0.15 -0.02 0" width="0.3" color="white" align="left"></a-text>

    <script type="text/javascript">
      let latitudeDisplay = document.getElementById("latitude-display");
      let longitudeDisplay = document.getElementById("longitude-display");
      let dateTimeDisplay = document.getElementById("date-time-display");
      let sceneEl = document.querySelector('a-scene');
      let cameraRig = document.getElementById("camera-rig");
      let azContainer = document.getElementById("az-container");
      let eqContainer = document.getElementById("eq-container");
      let precessionContainer = document.getElementById("precession-container");
      let starsPointCloud = document.getElementById("stars-point-cloud");
      let milkyway = document.getElementById("milkyway");

      const initialLatitude = 50.5;
      const initialLongitude = 9.7;
      window.latitude = initialLatitude;
      window.longitude = initialLongitude;
      let elevation = 300;

      function updateInitText() {
        if (!latitudeDisplay) latitudeDisplay = document.getElementById("latitude-display");
        if (latitudeDisplay) {
          latitudeDisplay.setAttribute("text", `value: Latitude: ${latitude.toFixed(1)}; color: white; width: 1; align: center`);
        }
      }
      updateInitText();

      // Initialize a base date/time for the simulation.
      window.simulationTime = luxon.DateTime.now(); // Current local date and time
      console.log(simulationTime.zoneName);

      let observer = new Astronomy.Observer(latitude, longitude, elevation);

      let isRightControllerGripDown = false;
      window.micEnabled = false;

      function syncSky() {
        const skyMaster = document.getElementById('sky-master');
        if (skyMaster && NAF.connection && NAF.connection.adapter) {
          if (!NAF.utils.isMine(skyMaster)) {
            console.log("Taking ownership of sky-master to sync state...");
            NAF.utils.takeOwnership(skyMaster);
          }
          console.log("Broadcasting Sky State:", {
            time: simulationTime.toISO(),
            latitude: latitude,
            longitude: longitude
          });
          skyMaster.setAttribute('sky-state', {
            time: simulationTime.toISO(),
            latitude: window.latitude,
            longitude: window.longitude,
            showMeridian: document.getElementById('meridian')?.getAttribute('visible') || false,
            showEquator: document.getElementById('equator')?.getAttribute('visible') || false,
            showEcliptic: document.getElementById('ecliptic')?.getAttribute('visible') || false,
            showCardinalPoints: document.getElementById('cardinal-points')?.getAttribute('visible') || false,
            showCelestialPoles: document.getElementById('ncp')?.getAttribute('visible') || false
          });
        }
      }

      function setNow() {
        simulationTime = luxon.DateTime.now();
        syncSky();
        updateScene();
      }

      function adjustTime(unit, amount) {
        simulationTime = simulationTime.plus({ [unit]: amount });
        syncSky();
        updateScene();
      }

      function adjustCoordinate(type, amount) {
        if (type === 'latitude') {
          latitude = Math.max(-90, Math.min(90, latitude + amount));
        } else if (type === 'longitude') {
          longitude = longitude + amount;
          // Wrap longitude between -180 and 180
          if (longitude > 180) longitude -= 360;
          if (longitude < -180) longitude += 360;
        }
        syncSky();
        updateScene();
      }

      // Function to update the scene
      function updateScene() {
        if (!sceneEl) sceneEl = document.querySelector('a-scene');
        if (!cameraRig) cameraRig = document.getElementById("camera-rig");
        if (!azContainer) azContainer = document.getElementById("az-container");
        if (!eqContainer) eqContainer = document.getElementById("eq-container");
        if (!precessionContainer) precessionContainer = document.getElementById("precession-container");
        if (!starsPointCloud) starsPointCloud = document.getElementById("stars-point-cloud");
        if (!milkyway) milkyway = document.getElementById("milkyway");
        if (!latitudeDisplay) latitudeDisplay = document.getElementById("latitude-display");
        if (!longitudeDisplay) longitudeDisplay = document.getElementById("longitude-display");
        if (!dateTimeDisplay) dateTimeDisplay = document.getElementById("date-time-display");

        let lst = calculateLocalSiderealTime(simulationTime.toUTC().toJSDate(), longitude);
        let lstDegrees = lst * 15; // Convert LST from hours to degrees

        // Update scene elements based on the new simulation time or latitude
        if (eqContainer) {
          eqContainer.setAttribute('rotation', { x: latitude - 180, y: 0, z: lstDegrees - 90 });
        }

        let currentYear = simulationTime.year;
        let precessionDegrees = (currentYear - 2000) * 360 / 25750; // Simplified precession effect
        if (precessionContainer) {
          precessionContainer.setAttribute('rotation', { x: 23.43619, y: 0, z: precessionDegrees });
        }

        observer = new Astronomy.Observer(latitude, longitude, elevation);
        let sunRaDec = Astronomy.Equator('Sun', simulationTime.toJSDate(), observer, false, false);
        let sunAltAz = Astronomy.Horizon(simulationTime.toJSDate(), observer, sunRaDec.ra, sunRaDec.dec, false);
        console.log(sunAltAz);

        if (dateTimeDisplay) {
          dateTimeDisplay.setAttribute("text", `value: ${simulationTime.toLocaleString(luxon.DateTime.DATETIME_FULL_WITH_SECONDS)}; color: white; width: 0.5; align: center`);
        }
        //sunElevationDisplay.setAttribute("text", `value: sun elev.: ${sunAltAz.altitude.toFixed(1)}; color: white; width: 1; align: center`);

        // Update latitude/longitude displays on the control panel
        const latLabel = latitude >= 0 ? "N" : "S";
        if (latitudeDisplay) {
          latitudeDisplay.setAttribute("text", `value: Latitude: ${Math.abs(latitude).toFixed(1)}° ${latLabel}; color: white; width: 1; align: center`);
        }

        const lonLabel = longitude >= 0 ? "O" : "W";
        if (longitudeDisplay) {
          longitudeDisplay.setAttribute("text", `value: Longitude: ${Math.abs(longitude).toFixed(1)}° ${lonLabel}; color: white; width: 1; align: center`);
        }

        const distance = 394;

        const x = -distance * Math.cos((sunAltAz.altitude * Math.PI) / 180) * Math.sin((sunAltAz.azimuth * Math.PI) / 180);
        const y = distance * Math.sin((sunAltAz.altitude * Math.PI) / 180);
        const z = distance * Math.cos((sunAltAz.altitude * Math.PI) / 180) * Math.cos((sunAltAz.azimuth * Math.PI) / 180);

        if (sceneEl) {
          sceneEl.setAttribute('environment', 'lightPosition', `${x} ${y} ${z}`);
        }

        if (starsPointCloud && starsPointCloud.components && starsPointCloud.components.starfield) {
          starsPointCloud.components.starfield.update();
        }

        let skyBrightness = mapSunAltitudeToSkyBrightness(sunAltAz.altitude, 0.0);
        if (typeof starShaderMaterial !== 'undefined') {
          starShaderMaterial.uniforms.skyBrightness.value = skyBrightness;
        }
        if (typeof haloShaderMaterial !== 'undefined') {
          haloShaderMaterial.uniforms.skyBrightness.value = skyBrightness;
        }
        if (milkyway) {
          milkyway.setAttribute('opacity', mapRange(skyBrightness, 0.0, 0.2, 0.25, 0.0)); //milky way max. brightness 25%, fading 5x faster than the stars
        }
      }


      // Debounce function to limit the frequency of updates
      function debounce(func, delay) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func(...args), delay);
        };
      }

      // Wrap updateScene with debounce (adjust delay as necessary)
      const debouncedUpdateScene = debounce(updateScene, 100);  // 100ms delay


      function throttle(func, limit) {
        let inThrottle;
        return function (...args) {
          if (!inThrottle) {
            func(...args);
            inThrottle = true;
            setTimeout(() => (inThrottle = false), limit);
          }
        };
      }

      // Throttle updateScene to run every 30ms
      const throttledUpdateScene = throttle(updateScene, 30);



      // Utility function to map the Sun's altitude to a sky brightness value
      function mapSunAltitudeToSkyBrightness(altitude, lightPollution) {
        // Example mapping, adjust thresholds and brightness levels as needed
        if (altitude > -4.0) {
          // Daytime
          return 1.0; // Maximum brightness
        } else if (altitude > -16.5 && altitude <= -4.0) {
          // Twilight
          return Math.max(lightPollution, 1.3 * (altitude + 16.5) / 16.5); // Gradual decrease
        } else {
          // Nighttime
          return 0.0 + lightPollution; // Minimum brightness for stars visibility
        }
      }


      function mapRange(value, inMin, inMax, outMin, outMax) {
        return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
      }

      //eqContainer.setAttribute('rotation', `${latitude - 180} 0 180`);


      // document.addEventListener('DOMContentLoaded', (event) => {
      //   starsPointCloud.addEventListener('loaded', function() {
      //     updateScene();
      //   });
      // });

      document.addEventListener('DOMContentLoaded', function () {
        const scene = document.querySelector('a-scene');
        if (scene) {
          if (scene.hasLoaded) {
            updateLoadingIndicator('assets', true);
            updateScene();
          } else {
            scene.addEventListener('loaded', function () {
              updateLoadingIndicator('assets', true);
              updateScene();
            });
          }
        }
      });




      // Event listeners for the reset button
      const resetButton = document.getElementById("reset-button");
      resetButton.addEventListener("mouseenter", function () {
        resetButton.setAttribute("scale", "1.2 1.2 1");
      });
      resetButton.addEventListener("mouseleave", function () {
        resetButton.setAttribute("scale", "1 1 1");
      });

      // Function to reload the page
      function resetScene() {
        location.reload();
      }



      // Eq-Container rotation based on the left joystick
      const leftController = document.getElementById("left-controller");
      const timeAdjustmentSpeed = 60; // seconds
      const latitudeAdjustmentSpeed = 0.05; // degrees
      const starRotationSpeed = 0.001;
      const joystickThreshold = 0.95;

      leftController.addEventListener("thumbstickmoved", function (event) {
        if (event.detail.x !== 0) {
          // Adjust simulation time by the thumbstick's X axis movement.
          let timeAdjustment = Math.pow(event.detail.x, 3.0) * timeAdjustmentSpeed;
          //simulationTime = new DateTime(simulationTime.getTime() + timeAdjustment);
          simulationTime = simulationTime.plus({ seconds: timeAdjustment });
          // Update the scene based on the new simulation time.
          //debouncedUpdateScene();
          //throttledUpdateScene()
          syncSky();
          updateScene();
        }
        if (Math.abs(event.detail.y) >= joystickThreshold) {
          //eqContainer.object3D.rotation.x -= event.detail.y * starRotationSpeed;
          let latitudeAdjustment = -event.detail.y * latitudeAdjustmentSpeed;
          updateLatitude(latitude + latitudeAdjustment);

          syncSky();
          updateScene();
        }
      });



      function updateLatitude(newLatitude) {
        // Ensure newLatitude is within -90 and 90 degrees
        if (newLatitude > 90) {
          latitude = 90;
        } else if (newLatitude < -90) {
          latitude = -90;
        } else {
          latitude = newLatitude;
        }
      }


      // function toggleControlPanel(panelId) {
      //   const controlPanels = document.querySelectorAll('[control-panel]');
      //   controlPanels.forEach(panel => {
      //     const isEnabled = panel.getAttribute('control-panel').id === panelId;
      //     panel.setAttribute('control-panel', 'visible', isEnabled);
      //   });
      // }

      // Toggle visibility of control panel with X button
      const controlPanels = document.querySelectorAll('a-control-panel');
      let lastEnabledControlPanel = null;
      console.log("Control Panels:", controlPanels);

      leftController.addEventListener("xbuttonup", function (event) {
        if (!lastEnabledControlPanel) {
          lastEnabledControlPanel = document.querySelector('a-control-panel');
        }
        if (lastEnabledControlPanel) {
          const isEnabled = lastEnabledControlPanel.getAttribute("enabled") === "true";
          lastEnabledControlPanel.setAttribute("enabled", !isEnabled);
        }
      });

      leftController.addEventListener("gripdown", function (event) {
        if (sceneEl.is('vr-mode') && NAF.connection && NAF.connection.adapter) {
          NAF.connection.adapter.enableMicrophone(true);
          window.micEnabled = true;
          const micBtnEle = document.getElementById('mic-btn');
          if (micBtnEle) micBtnEle.textContent = 'Mute Mic';
        }
      });

      leftController.addEventListener("gripup", function (event) {
        if (sceneEl.is('vr-mode') && NAF.connection && NAF.connection.adapter) {
          NAF.connection.adapter.enableMicrophone(false);
          window.micEnabled = false;
          const micBtnEle = document.getElementById('mic-btn');
          if (micBtnEle) micBtnEle.textContent = 'Unmute Mic';
        }
      });

      function onTogglerClick(action) { // 'action' is the clickActionParam
        const meridianEl = document.getElementById('meridian');
        const equatorEl = document.getElementById('equator');
        const eclipticEl = document.getElementById('ecliptic');
        const cardinalPointsEl = document.getElementById('cardinal-points');
        const ncpEl = document.getElementById('ncp');
        const ncpGlowEl = document.getElementById('ncp_glow');
        const scpEl = document.getElementById('scp');
        const scpGlowEl = document.getElementById('scp_glow');

        if (!meridianEl) {
          console.error("Meridian element ('meridian') not found.");
        }
        if (!equatorEl) {
          console.error("Equator element ('equator') not found.");
        }
        if (!eclipticEl) {
          console.error("Ecliptic element ('ecliptic') not found.");
        }
        if (!cardinalPointsEl) {
          console.error("Cardinal points element ('cardinal-points') not found.");
        }
        if (!ncpEl) {
          console.error("NCP element ('ncp') not found.");
        }
        if (!ncpGlowEl) {
          console.error("NCP glow element ('ncp_glow') not found.");
        }
        if (!scpEl) {
          console.error("SCP element ('scp') not found.");
        }
        if (!scpGlowEl) {
          console.error("SCP glow element ('scp_glow') not found.");
        }

        let newVisibility;

        switch (action) {
          case 'toggleMeridian':
            if (meridianEl) {
              newVisibility = !meridianEl.getAttribute('visible');
              meridianEl.setAttribute('visible', newVisibility);
              console.log('Meridian visibility toggled to:', newVisibility);
            }
            break;
          case 'toggleEquator':
            if (equatorEl) {
              newVisibility = !equatorEl.getAttribute('visible');
              equatorEl.setAttribute('visible', newVisibility);
              console.log('Equator visibility toggled to:', newVisibility);
            }
            break;
          case 'toggleEcliptic':
            if (eclipticEl) {
              newVisibility = !eclipticEl.getAttribute('visible');
              eclipticEl.setAttribute('visible', newVisibility);
              console.log('Ecliptic visibility toggled to:', newVisibility);
            }
            break;
          case 'toggleHints':
            const hints = document.querySelectorAll('.controller-hint');
            hints.forEach(hint => {
              newVisibility = !hint.getAttribute('visible');
              hint.setAttribute('visible', newVisibility);
            });
            console.log('Controller hints visibility toggled');
            break;
          case 'toggleCardinalPoints':
            if (cardinalPointsEl) {
              newVisibility = !cardinalPointsEl.getAttribute('visible');
              cardinalPointsEl.setAttribute('visible', newVisibility);
              console.log('Cardinal points visibility toggled to:', newVisibility);
            }
            break;
          case 'toggleNCP':
            if (ncpEl && ncpGlowEl && scpEl && scpGlowEl) {
              newVisibility = !ncpEl.getAttribute('visible'); // Assuming all poles have the same visibility state
              ncpEl.setAttribute('visible', newVisibility);
              ncpGlowEl.setAttribute('visible', newVisibility);
              scpEl.setAttribute('visible', newVisibility);
              scpGlowEl.setAttribute('visible', newVisibility);
              console.log('Celestial Poles visibility toggled to:', newVisibility);
            }
            break;
          // Example for other existing actions, like 'red', if needed.
          // case 'red':
          //   console.log('Red button action triggered');
          //   // Handle the logic for the red button if needed
          //   break;
          default:
            console.warn('Unknown or unhandled toggle action:', action);
        }
        syncSky();
      }

      // Rotation of the Az-Container around the y-Axis
      const azimuthRotationStep = 30;
      let isJoystickReleased = true;

      const rightController = document.getElementById("right-controller");

      // 'A' button state variables
      let aButtonDownTimestamp = 0;
      let aButtonIsPhysicallyDown = false;
      const HOLD_DURATION_THRESHOLD = 1000; // 1 second for hold
      let holdActionTriggered = false;
      let aHoldIntervalId = null; // Changed from aHoldCheckAnimationId
      // let frameCount = 0; // No longer using frameCount

      rightController.addEventListener("gripdown", function (event) {
        const pointer = document.getElementById("pointer");
        pointer.setAttribute('visible', true);
        isRightControllerGripDown = true;
      });
      rightController.addEventListener("gripup", function (event) {
        const pointer = document.getElementById("pointer");
        pointer.setAttribute('visible', false);
        isRightControllerGripDown = false;
      });

      rightController.addEventListener('bbuttondown', () => {
        rightController.components.drawing.startDrawing();
      });
      rightController.addEventListener('bbuttonup', () => {
        rightController.components.drawing.stopDrawing();
      });
      rightController.addEventListener('abuttondown', (event) => {
        aButtonIsPhysicallyDown = true;
        aButtonDownTimestamp = performance.now(); // Use performance.now()
        holdActionTriggered = false; // Reset for new press sequence
        // frameCount = 0; 

        // const drawingComponent = rightController.components.drawing;
        // if (drawingComponent && drawingComponent.lineMaterial) {
        //   drawingComponent.lineMaterial.color.set('blue'); 
        // }

        if (aHoldIntervalId) { // Ensure any old interval is cancelled
          clearInterval(aHoldIntervalId);
        }
        aHoldIntervalId = setInterval(checkAHoldWithInterval, 16); // Approx 60fps
      });

      rightController.addEventListener('abuttonup', (event) => {
        const wasPhysicallyDown = aButtonIsPhysicallyDown;
        aButtonIsPhysicallyDown = false; // Update state: button is now up

        if (aHoldIntervalId) {
          clearInterval(aHoldIntervalId);
          aHoldIntervalId = null;
        }

        // Process tap if the button was down AND hold was not triggered during its press cycle
        if (wasPhysicallyDown && !holdActionTriggered) {
          const drawingComponent = rightController.components.drawing;
          if (drawingComponent) {
            drawingComponent.clearLastSegment();
          }
        }
        // holdActionTriggered is reset in abuttondown for the next full press sequence
      });

      function checkAHoldWithInterval() {
        if (!aButtonIsPhysicallyDown || holdActionTriggered) {
          if (aHoldIntervalId) {
            clearInterval(aHoldIntervalId);
            aHoldIntervalId = null;
          }
          return;
        }

        const currentHoldDuration = performance.now() - aButtonDownTimestamp;

        if (currentHoldDuration >= HOLD_DURATION_THRESHOLD) {
          const comp = rightController.components.drawing;
          if (comp) {
            // if (comp.lineMaterial) { 
            //   comp.lineMaterial.color.set('magenta'); 
            // }
            comp.clearDrawing();
          }
          holdActionTriggered = true;

          // Interval is already cleared in the first check of this function if holdActionTriggered becomes true
          // or by aButtonIsPhysicallyDown becoming false. Explicit clear here is also fine.
          if (aHoldIntervalId) {
            clearInterval(aHoldIntervalId);
            aHoldIntervalId = null;
          }
        }
        // No recursive call needed, setInterval handles the looping
      }

      rightController.addEventListener("thumbstickmoved", function (event) {
        if (!isRightControllerGripDown) {
          if (event.detail.x > 0.8 && isJoystickReleased) {
            rotateCameraRig(-azimuthRotationStep);
            isJoystickReleased = false;
          } else if (event.detail.x < -0.8 && isJoystickReleased) {
            rotateCameraRig(azimuthRotationStep);
            isJoystickReleased = false;
          } else if (event.detail.x >= -0.8 && event.detail.x <= 0.8) {
            isJoystickReleased = true;
          }
        }

        // if (Math.abs(event.detail.y) >= joystickThreshold) {
        //   precessionContainer.object3D.rotation.z -= event.detail.y * starRotationSpeed;
        // }
      });

      function rotateCameraRig(rotationStep) {
        const rig = document.getElementById('camera-rig');
        const camera = document.getElementById('camera');

        // 1. Get current World Positions
        const camWorldPos = new THREE.Vector3();
        const rigWorldPos = new THREE.Vector3();
        camera.object3D.getWorldPosition(camWorldPos);
        rig.object3D.getWorldPosition(rigWorldPos);

        // 2. Calculate the rotation in Radians
        const currentRotY = THREE.MathUtils.degToRad(rig.getAttribute('rotation').y);
        const addRotY = THREE.MathUtils.degToRad(rotationStep);
        const newRotY = currentRotY + addRotY;

        // 3. THE "ANTI-SWING" MATH
        // We need to move the Rig so that after rotation, 
        // the camera stays at the EXACT same World Position.

        // Vector from Rig center to Camera (horizontal only)
        const pivotOffset = new THREE.Vector3().subVectors(camWorldPos, rigWorldPos);
        pivotOffset.y = 0;

        // Rotate that offset by the turn amount
        const rotatedOffset = pivotOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), addRotY);

        // The Rig's new position is: CameraWorldPos - RotatedOffset
        const newRigPos = new THREE.Vector3().subVectors(camWorldPos, rotatedOffset);

        // 4. APPLY TO RIG (Atomic Update)
        // We use your rounding logic for the visual rotation
        const finalDegY = Math.round(THREE.MathUtils.radToDeg(newRotY) / azimuthRotationStep) * azimuthRotationStep;

        rig.setAttribute('position', { x: newRigPos.x, y: 0, z: newRigPos.z });
        rig.setAttribute('rotation', { x: 0, y: finalDegY, z: 0 });

        // 5. CRITICAL: Tell the follower script to update its 'last known pos'
        // using the NEW rig position as the baseline
        const follower = rig.components['rig-follower'];
        if (follower) {
          // We update the baseline to the current camera world pos
          // so the next 'tick' sees 0 movement.
          follower.lastCamWorldPos.copy(camWorldPos);
        }
      }

    </script>

    <script>
      // Function to calculate Local Sidereal Time (LST)
      function calculateLocalSiderealTime(utc, longitude) {
        //let observer = new Astronomy.Observer(latitude, longitude, elevation);
        console.log(utc);
        // Calculate Greenwich Apparent Sidereal Time (GMST) in hours
        let GAST = Astronomy.SiderealTime(utc);
        console.log("GAST:", GAST);

        // Local Apparent Sidereal Time (LAST) in hours
        let LAST = GAST + (longitude / 15);
        LAST = LAST % 24;
        console.log("LAST:", LAST);
        return -LAST;
      }

    </script>
