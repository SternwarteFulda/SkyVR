<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/js/aframe/aframe.min.js"></script>
  <script src="/js/socket.io/socket.io.min.js"></script>
  <script src="/easyrtc/easyrtc.js"></script>
  <script src="/js/networked-aframe/networked-aframe.min.js"></script>
  <script>
    // Initialize loading status immediately to prevent race conditions
    window.loadingStatus = {
      assets: false,
      network: false,
      stars: false,
      sync: false
    };
    if (typeof window.localPlayerSpawned === 'undefined') {
      window.localPlayerSpawned = false;
    }
    // Track if we have received a valid sky state from the network or if we are the room creator
    window.skyStateInitialized = false;
    window.skyStateLastSync = 0;
    window.nafConnectTime = 0; // Track when NAF actually connected
    window.reverseMouse = true; // Move sky (Default) vs Move camera

    // Helper to determine if we are safe to broadcast changes to the room
    window.canUpdateSkyState = function () {
      if (window.skyStateInitialized) return true;

      // If we are alone, we are allowed after a short grace period starting from CONNECTION
      if (typeof NAF !== 'undefined' && NAF.connection && NAF.connection.adapter && NAF.connection.isConnected()) {
        if (!window.nafConnectTime) window.nafConnectTime = performance.now();

        const connectedClients = NAF.connection.getConnectedClients();
        const skyMaster = document.getElementById('sky-master');
        const isOwner = skyMaster && NAF.utils.isMine(skyMaster);

        // GRADUATION: We graduate to Master if:
        // 1. We've been connected for at least 5 seconds.
        // 2. We either see NO ONE or we are the OWNER of the sky-master entity.
        if (performance.now() - window.nafConnectTime > 5000) {
          if (Object.keys(connectedClients).length === 0 || isOwner) {
            console.log("canUpdateSkyState: Graduating to Master (Owner or Alone).");
            window.skyStateInitialized = true;
            updateLoadingIndicator('sync', true);
            return true;
          }
        }
      }
      return false;
    };

    function checkLoadingComplete() {
      if (performance.now() % 5000 < 100) { // Log every ~5s
        console.log("Loading Status:", JSON.parse(JSON.stringify(window.loadingStatus)), "PlayerSpawned:", window.localPlayerSpawned);
      }

      const isSolo = new URLSearchParams(window.location.search).get('room') === 'none';
      if (isSolo) {
        window.loadingStatus.network = true;
        window.loadingStatus.sync = true;
      }

      if (window.loadingStatus.assets &&
        window.loadingStatus.network &&
        window.loadingStatus.stars &&
        window.loadingStatus.sync &&
        window.localPlayerSpawned) {
        const overlay = document.getElementById('loading-overlay');
        if (overlay && overlay.style.display !== 'none') {
          overlay.classList.add('fade-out');
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 1000);
        }
      }
    }


    function updateLoadingIndicator(type, status) {
      window.loadingStatus[type] = status;
      const item = document.getElementById(`status-${type}`);
      const isSolo = new URLSearchParams(window.location.search).get('room') === 'none';

      if (item) {
        // Hide network/sync steps in solo mode
        if (isSolo && (type === 'network' || type === 'sync')) {
          item.style.display = 'none';
          return;
        }

        if (status) {
          item.classList.remove('active');
          item.classList.add('complete');
          item.querySelector('.icon').textContent = '✓';
          if (type === 'network') {
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room') || 'default';
            item.querySelector('.label').textContent = `Connected to Room: ${room}`;
          } else if (type === 'assets') {
            item.querySelector('.label').textContent = 'Modules Ready';
          } else if (type === 'stars') {
            item.querySelector('.label').textContent = 'Star Map Processed';
          } else if (type === 'sync') {
            item.querySelector('.label').textContent = 'Universe Synchronized';
          }
        } else {
          item.classList.add('active');
          item.querySelector('.icon').textContent = '○';
        }
      }
      checkLoadingComplete();
    }

    window.onLocalPlayerSpawned = function () {
      console.log("Local player spawned and positioned. Fading loading screen.");
      window.localPlayerSpawned = true;
      checkLoadingComplete();
    };

    // Safety fallback
    setInterval(checkLoadingComplete, 1000);

    // Network connection timeout fallback (e.g. for mic rejection)
    setTimeout(() => {
      if (!window.loadingStatus.network && urlParams.get('mic') !== 'false') {
        const fallbackMsg = document.getElementById('network-fallback');
        if (fallbackMsg) {
          fallbackMsg.style.display = 'block';
        }
      }
    }, 8000); // Show after 8 seconds of waiting for network

    window.joinWithoutAudio = function () {
      const url = new URL(window.location.href);
      url.searchParams.set('mic', 'false');
      window.location.href = url.toString();
    };
  </script>

  <script>

    AFRAME.registerComponent('sky-state', {
      schema: {
        time: { type: 'string', default: '' },
        latitude: { type: 'number', default: 50.5 },
        longitude: { type: 'number', default: 9.7 },
        showMeridian: { type: 'boolean', default: false },
        showEquator: { type: 'boolean', default: false },
        showEcliptic: { type: 'boolean', default: false },
        showCardinalPoints: { type: 'boolean', default: true },
        showCelestialPoles: { type: 'boolean', default: false },
        activeConstellations: { type: 'string', default: 'INIT' },
        heartbeat: { type: 'number', default: 0 }
      },
      init: function () {
        // Watchdog interval (same logic as constellations)
        this.checkInterval = setInterval(() => this.checkSharedState(), 2000);
        console.log("sky-state: Watchdog started (2s interval).");

        this.targetTime = null;
        this.targetLatitude = null;
        this.targetLongitude = null;
        this.lerpSpeed = 5.0; // Moderate speed (catch up in ~200ms)
      },
      remove: function () {
        if (this.checkInterval) clearInterval(this.checkInterval);
      },
      checkSharedState: function () {
        if (typeof NAF === 'undefined' || !NAF.connection.isConnected()) return;

        // Proactively check if we can graduate to Master (handles solitary master case)
        if (typeof window.canUpdateSkyState === 'function') {
          window.canUpdateSkyState();
        }

        const isOwner = NAF.utils.isMine(this.el);
        if (isOwner) {
          // Master PUSH logic: Periodically refresh the broadcast to catch up any joining players
          if (window.skyStateInitialized) {
            syncSky(true);
          }
        } else {
          // Client PULL logic: If we see data in the component that we haven't applied yet, pull it.
          // RESURRECTION: If shared state is null (INIT) but we have a valid local state, 
          // it means the state was wiped (likely by a new master). We must fix it.
          if (this.data.activeConstellations === 'INIT') {
            if (window.skyStateInitialized) {
              console.warn("sky-state: Shared state is INIT but local is NOT. Taking ownership to restore room.");
              NAF.utils.takeOwnership(this.el);
              syncSky();
            }
            return;
          }

          const sharedTime = luxon.DateTime.fromISO(this.data.time);
          const timeDrift = Math.abs(window.simulationTime.diff(sharedTime, 'seconds').seconds);
          const latDrift = Math.abs(window.latitude - this.data.latitude);

          if (timeDrift > 5 || latDrift > 0.01) {
            console.log("sky-state: Watchdog detected drift from master. Pulling state...");
            // Instead of just update(), let's explicitly copy the data to our locals
            window.simulationTime = sharedTime;
            // CRITICAL: Update local target to match to prevent jump-back on interaction
            if (window.targetSimulationTime) window.targetSimulationTime = sharedTime;

            window.latitude = this.data.latitude;
            window.longitude = this.data.longitude;
            updateScene();

            const incomingIsInit = (this.data.activeConstellations === 'INIT');
            if (!incomingIsInit) {
              window.skyStateInitialized = true;
              updateLoadingIndicator('sync', true);
            }
          }
        }
      },
      tick: function (t, dt) {
        if (!NAF.utils.isMine(this.el) && this.targetTime && window.simulationTime) {
          // Only interpolate if the difference is reasonable (e.g. < 1 hour)
          // If it's a huge jump (reset/preset), snap immediately.
          const diffSeconds = this.targetTime.diff(window.simulationTime, 'seconds').seconds;

          if (Math.abs(diffSeconds) > 3600) {
            // Huge jump, snap
            window.simulationTime = this.targetTime;
            this.targetTime = null; // Done
          } else if (Math.abs(diffSeconds) > 0.1) {
            // Smooth Lerp
            // dt is ms, so dt/1000 is seconds.
            // frameStep = error * speed * dt
            const step = diffSeconds * this.lerpSpeed * (dt / 1000);
            window.simulationTime = window.simulationTime.plus({ seconds: step });
          } else {
            // Close enough
            window.simulationTime = this.targetTime;
          }
          // Also smooth Latitude/Longitude if needed? usually only Time is "scrubbed".
          // Let's stick to time for now as it's the main stutter source.

          // IMPORTANT: Must call updateScene to reflect the interpolated time
          updateScene();

          // Also keep local target in sync so if we TAKE ownership, we start from here
          if (window.targetSimulationTime) {
            window.targetSimulationTime = window.simulationTime;
          }
        }
      },
      update: function (oldData) {
        if (typeof luxon === 'undefined') return;

        // PROTECTION: If we are already initialized and we receive an "INIT" state from someone else,
        // it's almost certainly a "joining-wipe" packet from a newcomer. We MUST ignore it.
        const isRemote = !NAF.utils.isMine(this.el);
        const incomingIsInit = (this.data.activeConstellations === 'INIT');

        if (isRemote && incomingIsInit && window.skyStateInitialized) {
          console.warn("sky-state: Ignoring 'INIT' state from remote. Likely a newcomer-wipe attempt.");
          return;
        }

        // We only consider the state "Synchronized" if we've received data with a heartbeat
        // OR if we've been promoted to Master.
        if (isRemote && !incomingIsInit && this.data.heartbeat > 0) {
          if (!window.skyStateInitialized) {
            console.log("sky-state: First heartbeat received. Syncing reality...");
          }
          window.skyStateInitialized = true;
          updateLoadingIndicator('sync', true);
        }

        if (isRemote) {
          if (this.data.time && this.data.time !== oldData.time) {
            if (!incomingIsInit) {
              // Instead of setting simulationTime directly, set a target
              this.targetTime = luxon.DateTime.fromISO(this.data.time);

              // If this is the FIRST update or a huge jump, snap instantly to avoid weird glide
              if (!window.simulationTime || Math.abs(this.targetTime.diff(window.simulationTime, 'seconds').seconds) > 3600) {
                window.simulationTime = this.targetTime;
              }
            }
          }
          if (this.data.latitude !== undefined && this.data.latitude !== oldData.latitude) {
            if (!incomingIsInit) {
              window.latitude = this.data.latitude;
            }
          }
          if (this.data.longitude !== undefined && this.data.longitude !== oldData.longitude) {
            if (!incomingIsInit) {
              window.longitude = this.data.longitude;
            }
          }
        }
        if (this.data.activeConstellations !== oldData.activeConstellations) {
          if (isRemote) console.log(`Sky State: activeConstellations changed from "${oldData.activeConstellations}" to "${this.data.activeConstellations}"`);
          if (this.data.activeConstellations === 'INIT') {
            return;
          }
          const renderer = document.getElementById('constellation-lines')?.components['constellation-renderer'];
          if (renderer) {
            try {
              const activeItems = JSON.parse(this.data.activeConstellations);
              console.log('Sky State: Triggering renderer sync with', activeItems.length, 'items');
              renderer.syncConstellations(activeItems);
            } catch (e) {
              console.error('Sky State: Error parsing activeConstellations:', e, this.data.activeConstellations);
            }
          } else {
            console.warn('Sky State: constellation-renderer not found for sync. Will rely on renderer pulling state on load.');
          }
        }

        const guides = {
          'meridian': this.data.showMeridian,
          'equator': this.data.showEquator,
          'ecliptic': this.data.showEcliptic,
          'cardinal-points': this.data.showCardinalPoints,
          'ncp': this.data.showCelestialPoles,
          'ncp_glow': this.data.showCelestialPoles,
          'scp': this.data.showCelestialPoles,
          'scp_glow': this.data.showCelestialPoles
        };

        for (let id in guides) {
          let el = document.getElementById(id);
          if (el) el.setAttribute('visible', guides[id]);
        }

        if (typeof updateScene === 'function') {
          updateScene();
        }

      }
    });

    // see issue https://github.com/networked-aframe/networked-aframe/issues/267
    NAF.schemas.getComponentsOriginal = NAF.schemas.getComponents;
    NAF.schemas.getComponents = (template) => {
      if (!NAF.schemas.hasTemplate('#rig-template')) {
        NAF.schemas.add({
          template: '#rig-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#camera-template')) {
        NAF.schemas.add({
          template: '#camera-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            },
            {
              selector: '.nametag',
              component: 'position'
            },
            {
              selector: '.mic-indicator',
              component: 'position'
            },
            {
              component: 'player-info',
              property: 'name'
            },
            {
              component: 'player-info',
              property: 'color'
            },
            {
              component: 'player-info',
              property: 'spawned'
            },
            {
              component: 'player-info',
              property: 'spotId'
            },
            {
              component: 'player-info',
              property: 'micStatus'
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#right-controller-template')) {
        NAF.schemas.add({
          template: '#right-controller-template',
          components: [
            {
              component: 'position',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
            },
            {
              component: 'rotation',
              requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
            },
            {
              selector: '.pointer',
              component: 'visible'
            },
            {
              selector: '.pointer',
              component: 'position'
            },
            {
              selector: '.pointer',
              component: 'rotation'
            },
            {
              component: 'player-info',
              property: 'name'
            },
            {
              component: 'player-info',
              property: 'color'
            },
            {
              component: 'player-info',
              property: 'spawned'
            },
            {
              component: 'player-info',
              property: 'spotId'
            },
            {
              component: 'player-info',
              property: 'micStatus'
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#sky-template')) {
        NAF.schemas.add({
          template: '#sky-template',
          components: ['sky-state']
        });
      }
      if (!NAF.schemas.hasTemplate('#constellation-illustration-template')) {
        NAF.schemas.add({
          template: '#constellation-illustration-template',
          components: [
            {
              component: 'constellation-illustration',
              property: 'constellationId'
            },
            {
              component: 'constellation-illustration',
              property: 'opacity'
            }
          ]
        });
      }
      if (!NAF.schemas.hasTemplate('#drawing-stroke-template')) {
        NAF.schemas.add({
          template: '#drawing-stroke-template',
          components: [
            {
              component: 'drawing-stroke',
              property: 'points'
            },
            {
              component: 'drawing-stroke',
              property: 'color'
            }
          ]
        });
      }

      const components = NAF.schemas.getComponentsOriginal(template);
      return components;
    };

    // Sanitization functions for security
    function sanitizeRoomName(value) {
      if (!value) return null;
      return value.toLowerCase().replace(/[^a-z0-9-]/g, '').substring(0, 16);
    }

    function sanitizePlayerName(value) {
      if (!value) return null;
      return value.replace(/[^a-zA-Z0-9- ]/g, '').substring(0, 20);
    }

    // Parse URL parameters for room, name, and color
    const urlParams = new URLSearchParams(window.location.search);
    const roomParamRaw = urlParams.get('room');
    const nameParamRaw = urlParams.get('name');
    const roomParam = roomParamRaw === 'none' ? 'none' : sanitizeRoomName(roomParamRaw);
    const nameParam = sanitizePlayerName(nameParamRaw);
    const colorParam = urlParams.get('color');

    // Check if URL parameters were modified by sanitization
    if (!window.location.search.includes('no-redirect')) {
      let hasInvalidParams = false;
      let errorMessages = [];

      if (roomParamRaw && roomParam !== roomParamRaw) {
        errorMessages.push('Room name contains invalid characters.');
        hasInvalidParams = true;
      }

      if (nameParamRaw && nameParam !== nameParamRaw) {
        errorMessages.push('Player name contains invalid characters.');
        hasInvalidParams = true;
      }

      // Check length restrictions
      if (roomParamRaw && roomParamRaw.length > 16) {
        errorMessages.push('Room name exceeds 16 character limit.');
        hasInvalidParams = true;
      }

      if (nameParamRaw && nameParamRaw.length > 20) {
        errorMessages.push('Player name exceeds 20 character limit.');
        hasInvalidParams = true;
      }

      if (hasInvalidParams) {
        const errorMsg = 'Invalid URL Parameters:\n\n' +
          errorMessages.join('\n') +
          '\n\nRoom names: lowercase letters (a-z), numbers (0-9), and hyphens (-), max 16 chars.\n' +
          'Player names: letters (A-Z, a-z), numbers (0-9), hyphens (-), and spaces, max 20 chars.\n\n' +
          'You will be redirected to the lobby.';
        alert(errorMsg);
        window.location.href = 'lobby.html';
      }
    }

    window.getLobbyParams = function () {
      const camera = document.getElementById('camera');
      const room = roomParam || '';
      let name = nameParam || '';
      let color = colorParam || '';

      if (camera && camera.components['player-info']) {
        const data = camera.components['player-info'].data;
        name = data.name || name;
        color = data.color || color;
      }

      let params = `?room=${room}`;
      if (name) params += `&name=${encodeURIComponent(name)}`;
      if (color) params += `&color=${encodeURIComponent(color)}`;
      return params;
    };

    // If no room is specified, redirect to lobby (unless it's 'none' for solo)
    if (!roomParam && !window.location.search.includes('no-redirect')) {
      window.location.href = 'lobby.html' + window.getLobbyParams();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.getElementById('camera');
      const micEnabled = urlParams.get('mic') !== 'false';

      if (sceneEl) {
        if (roomParam && roomParam !== 'none') {
          sceneEl.setAttribute('networked-scene', 'room', roomParam);
          sceneEl.setAttribute('networked-scene', 'audio', micEnabled);
        } else if (roomParam === 'none') {
          console.log("Standalone mode: Disabling NAF and auto-completing network syncing.");
          sceneEl.removeAttribute('networked-scene');
          window.loadingStatus.network = true;
          window.loadingStatus.sync = true;
          window.skyStateInitialized = true;

          // Re-update indicators for UI
          setTimeout(() => {
            updateLoadingIndicator('network', true);
            updateLoadingIndicator('sync', true);
          }, 100);
        }

        // If mic is explicitly disabled or in solo mode, update the UI immediately
        if (!micEnabled || roomParam === 'none') {
          // No-op: mic-btn removed
        }
      }

      const rightControllerEl = document.getElementById('right-controller');

      const leftControllerEl = document.getElementById('left-controller');

      if (cameraEl) {
        if (nameParam) cameraEl.setAttribute('player-info', 'name', nameParam);
        if (colorParam) {
          const color = colorParam.startsWith('#') ? colorParam : '#' + colorParam;
          cameraEl.setAttribute('player-info', 'color', color);
        }
      }

      if (rightControllerEl) {
        if (nameParam) rightControllerEl.setAttribute('player-info', 'name', nameParam);
        if (colorParam) {
          const color = colorParam.startsWith('#') ? colorParam : '#' + colorParam;
          rightControllerEl.setAttribute('player-info', 'color', color);
        }
      }

      if (leftControllerEl) {
        if (nameParam) leftControllerEl.setAttribute('player-info', 'name', nameParam);
        if (colorParam) {
          const color = colorParam.startsWith('#') ? colorParam : '#' + colorParam;
          leftControllerEl.setAttribute('player-info', 'color', color);
        }
      }
    });

    window.onConnect = function () {
      console.log('onConnect', new Date());
      updateLoadingIndicator('network', true);
      const micEnabledParam = urlParams.get('mic') !== 'false';

      if (micEnabledParam && typeof NAF !== 'undefined' && NAF.connection && NAF.connection.adapter && typeof NAF.connection.adapter.enableMicrophone === 'function') {
        NAF.connection.adapter.enableMicrophone(false);
        window.micEnabled = false;
      }
    };

    // Dynamically align the visual pointer with the controller's rayOrigin
    document.addEventListener('controllermodelready', (evt) => {
      const el = evt.target;
      const rayOrigin = evt.detail.rayOrigin;
      if (!rayOrigin) return;

      const pointerEl = el.querySelector('.pointer');
      if (pointerEl) {
        console.log(`Aligning pointer for ${el.id} using rayOrigin`, rayOrigin);

        // Update position
        pointerEl.setAttribute('position', rayOrigin.origin);

        // Calculate rotation for the bottom-origin-cylinder component
        // The cylinder points -Y. We need to find the Euler angles (X, Y) to match rayOrigin.direction
        const dir = rayOrigin.direction;
        const pitch = Math.acos(-dir.y) * (180 / Math.PI);
        const yaw = Math.atan2(-dir.x, -dir.z) * (180 / Math.PI);

        pointerEl.setAttribute('bottom-origin-cylinder', 'rotation', { x: pitch, y: yaw, z: 0 });
      }
    });

    // Client-side ICE usage reporting
    document.addEventListener('DOMContentLoaded', () => {
      // Wait for NAF to be ready
      const checkNAF = setInterval(() => {
        if (typeof NAF !== 'undefined' && NAF.connection && NAF.connection.adapter) {
          clearInterval(checkNAF);

          // Hook into NAF/EasyRTC connection events if possible, or just poll
          // EasyRTC emits 'roomJoin' for us, but the peers come later.
          // Let's poll for active peer connections periodically (e.g. 10s after load, then every minute)

          const reportStats = async () => {
            // NAF uses easyrtc. easyrtc stores peer connections. 
            // We can try to access them via easyrtc.getPeerConnections() which returns an object { peerId: PC, ... }
            // (Depends on EasyRTC version, but typical API).
            if (typeof easyrtc === 'undefined' || !easyrtc.getPeerConnections) return;

            const peers = easyrtc.getPeerConnections();
            for (let peerId in peers) {
              const pc = peers[peerId];
              try {
                const stats = await pc.getStats();
                let activePairId = null;
                stats.forEach(report => {
                  if (report.type === 'transport' && report.selectedCandidatePairId) {
                    activePairId = report.selectedCandidatePairId;
                  }
                });

                // Fallback for some browsers where transport doesn't link directly, checking candidate-pair
                if (!activePairId) {
                  stats.forEach(report => {
                    if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.selected) {
                      activePairId = report.id;
                    }
                  });
                }

                if (activePairId) {
                  const pair = stats.get(activePairId);
                  if (pair) {
                    const localCand = stats.get(pair.localCandidateId);
                    const remoteCand = stats.get(pair.remoteCandidateId);

                    if (remoteCand) {
                      // Construct report
                      const info = {
                        peer: peerId,
                        type: remoteCand.candidateType, // 'host', 'srflx' (STUN), 'relay' (TURN)
                        protocol: remoteCand.protocol,
                        address: remoteCand.address || remoteCand.ip,
                        port: remoteCand.port
                      };

                      // Send to server
                      easyrtc.sendServerMessage('logIceUsage', info, (ack) => { });
                    }
                  }
                }
              } catch (e) { console.warn("Error getting stats for peer", peerId, e); }
            }
          };

          // Report 10 seconds after load (connection usually established)
          setTimeout(reportStats, 10000);
          // And maybe periodically?
          // setInterval(reportStats, 60000); 
        }
      }, 1000);
    });

  </script>

  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .infobar-2d {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      height: 60px;
      background: rgba(5, 5, 16, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-top: 2px solid #8a2be2;
      border-radius: 12px;
      z-index: 999999;
      pointer-events: auto;
      min-width: 500px;
      color: white;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Force visibility in fullscreen */
    :fullscreen .infobar-2d,
    :-webkit-full-screen .infobar-2d {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .infobar-2d.hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Hide 2D infobar while loading overlay is visible */
    #loading-overlay:not(.fade-out)~#infobar-2d {
      display: none !important;
    }

    /* Hide default A-Frame UI elements by default for 2D users */
    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-loader-title {
      display: none !important;
    }

    /* Show the native A-Frame VR button only when a headset is detected via JS */
    body.vr-device-detected .a-enter-vr {
      display: block !important;
    }

    .infobar-2d-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .infobar-2d-button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 8px;
    }

    .infobar-2d-button img {
      width: 20px;
      height: 20px;
      display: block;
    }

    body:not(.pointer-locked) .infobar-2d-button:hover {
      background: rgba(138, 43, 226, 0.2);
      border-color: #8a2be2;
    }

    .infobar-2d-button.active {
      background: rgba(138, 43, 226, 0.4);
      border-color: #8a2be2;
      box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
    }

    .infobar-2d-button.mic-on {
      border-color: #ff0000;
      background: rgba(255, 0, 0, 0.2);
    }

    #infobar-2d-room-text {
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .infobar-2d-modes {
      display: flex;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .infobar-2d {
        min-width: 90%;
        gap: 10px;
        padding: 0 16px;
      }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('SW registered:', registration.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</head>

<body>
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="spinner"></div>
      <h1 class="loading-title">SkyVR</h1>
      <ul class="status-list">
        <li id="status-assets" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Preloading Assets...</span>
        </li>
        <li id="status-network" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Connecting to Network...</span>
        </li>
        <li id="status-stars" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Downloading Star Data (35MB)...</span>
        </li>
        <li id="status-sync" class="status-item active">
          <span class="icon">○</span>
          <span class="label">Synchronizing Reality...</span>
        </li>
      </ul>

      <div id="network-fallback" style="display: none; margin-top: 2rem; animation: fadeIn 0.5s;">
        <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 1rem;">Taking longer than usual? Mic permission might
          be pending or blocked.</p>
        <button onclick="joinWithoutAudio()" style="
          background: rgba(255,255,255,0.1);
          border: 1px solid rgba(255,255,255,0.2);
          color: white;
          padding: 10px 20px;
          border-radius: 8px;
          cursor: pointer;
          font-family: inherit;
        ">Join without Audio</button>
      </div>

    </div>
  </div>

  <!-- 2D Infobar Overlay -->
  <div id="infobar-2d" class="infobar-2d">
    <div class="infobar-2d-section">
      <button id="infobar-2d-exit" class="infobar-2d-button" title="Exit Room">
        <img src="assets/icons/door.svg">
      </button>
      <span id="infobar-2d-room-text">----</span>
    </div>

    <div class="infobar-2d-section center-section">
      <button id="infobar-2d-mic" class="infobar-2d-button" title="Toggle Microphone">
        <img id="infobar-2d-mic-icon" src="assets/icons/mic-off.svg">
      </button>
      <button id="infobar-2d-fullscreen" class="infobar-2d-button" title="Toggle Fullscreen">
        <img src="assets/icons/fullscreen.svg">
      </button>
      <button id="infobar-2d-mouse-move" class="infobar-2d-button" title="Switch Mouse Direction (Camera vs Sky)">
        <img src="assets/icons/mouse-move.svg">
      </button>
    </div>

    <div class="infobar-2d-section infobar-2d-modes">
      <button id="infobar-2d-draw" class="infobar-2d-button active" title="Draw Mode" data-mode="draw">
        <img src="assets/icons/draw.svg">
      </button>
      <button id="infobar-2d-stickfigure" class="infobar-2d-button" title="Stick Figure" data-mode="stickfigure">
        <img src="assets/icons/stickfigure.svg">
      </button>
      <button id="infobar-2d-constellation" class="infobar-2d-button" title="Constellation" data-mode="constellation">
        <img src="assets/icons/constellation.svg">
      </button>
    </div>
  </div>

  <a-scene loading-screen="enabled: false" vr-mode-ui="enabled: true" high-res renderer="

      antialias: true;
      highRefreshRate: true;
      foveationLevel: 0.3" environment="
      active: true;
      stageSize: 401;
      preset: none;
      seed: 0;
      skyType: atmosphere;
      skyColor: #88c;
      horizonColor: #ddd;
      lighting: none;
      lightPosition: 300 0 300;
      fog: 0.75;
      flatShading: false;
      playArea: 1;
      ground: hills;
      groundYScale: 8;
      groundTexture: none;
      groundColor: #553e35;
      groundColor2: #694439;
      dressing: none;
      dressingAmount: 100;
      dressingColor: #795449;
      dressingScale: 5;
      dressingVariance: 1 1 1;
      dressingUniformScale: true;
      grid: crosses;
      dressingOnPlayArea: 0;
      gridColor: #39d2f2;
      shadow: false" networked-scene="
      debug: true;
      adapter: easyrtc;
      onConnect: onConnect;">

    <!-- 2D Infobar Overlay (Inside scene allows it to stay visible during A-Frame's internal fullscreen mode) -->



    <a-assets timeout="60000">

      <!-- Templates -->
      <!-- Avatar -->
      <template id="rig-template">
        <a-entity class="avatar-rig"></a-entity>
      </template>
      <template id="camera-template">
        <a-entity class="avatar-camera" networked-audio-source>
          <a-entity light="type: point; intensity: 0.4; distance: 4; decay: 2" position="0 0.5 -1.5"></a-entity>
          <a-sphere class="head" scale="0.2 0.22 0.2"></a-sphere>
          <a-entity class="face" position="0 0.05 0">
            <a-sphere class="eye" color="#efefef" position="0.06 0.05 -0.16" scale="0.04 0.04 0.04">
              <a-cylinder class="pupil" color="#000" position="0 0 -1" rotation="90 0 0" radius="0.2"
                height="0.05"></a-cylinder>
            </a-sphere>
            <a-sphere class="eyelid" position="0.06 0.05 -0.16" scale="0.042 0.042 0.042" theta-length="90"
              rotation="20 0 0"></a-sphere>
            <a-sphere class="eye" color="#efefef" position="-0.06 0.05 -0.16" scale="0.04 0.04 0.04">
              <a-cylinder class="pupil" color="#000" position="0 0 -1" rotation="90 0 0" radius="0.2"
                height="0.05"></a-cylinder>
            </a-sphere>
            <a-sphere class="eyelid" position="-0.06 0.05 -0.16" scale="0.042 0.042 0.042" theta-length="90"
              rotation="20 0 0"></a-sphere>
          </a-entity>

          <!-- mic indicator -->
          <a-entity class="mic-indicator" position="0 0.42 0" visible="false">
            <a-plane class="mic-icon" rotation="0 0 0" width="0.2" height="0.2"
              material="src: assets/icons/mic-on.svg; transparent: true; shader: flat; fog: false"></a-plane>
          </a-entity>

          <!-- here we add a text component for a nametag; the value will be updated by the player-info component -->
          <a-text class="nametag" value="?" rotation="0 0 0" position="0 -.35 0" align="center" font="mozillavr"
            side="front" scale=".5 .5 .5"></a-text>
        </a-entity>
      </template>
      <template id="right-controller-template">
        <a-entity player-info offscreen-indicator>
          <a-entity class="pointer" position="-0.0065 -0.0186 -0.05"
            bottom-origin-cylinder="height: 400; radius: 0.009; color: red; rotation: 53.53 8.87 0; opacity: 0.6;"
            visible="false">
          </a-entity>
        </a-entity>
      </template>
      <template id="sky-template">
        <a-entity></a-entity>
      </template>
      <template id="drawing-stroke-template">
        <a-entity drawing-stroke></a-entity>
      </template>
      <template id="constellation-illustration-template">
        <a-entity constellation-illustration></a-entity>
      </template>
      <!-- /Templates -->

      <img id="starTexture" src="assets/star.png">
      <img id="gaia" src="assets/gaia.png">
      <img id="halo" src="assets/halo.png">
      <img id="moon-map" src="assets/lroc_color_poles_1k.jpg">
      <img id="moon-bump" src="assets/ldem_3_8bit.jpg">

      <!-- UI Icons -->
      <img id="icon-door" src="assets/icons/door.svg">
      <img id="icon-mic-on" src="assets/icons/mic-on.svg">
      <img id="icon-mic-off" src="assets/icons/mic-off.svg">
      <img id="icon-draw" src="assets/icons/draw.svg">
      <img id="icon-stamp" src="assets/icons/stamp.svg">
      <img id="icon-stickfigure" src="assets/icons/stickfigure.svg">
      <img id="icon-constellation" src="assets/icons/constellation.svg">
      <img id="icon-mouse-move" src="assets/icons/mouse-move.svg">

      <script src="components/aframe-environment-component.js"></script>
      <script src="/js/aframe-extras/aframe-extras.primitives.min.js"></script>
      <script src="components/spawn-in-spots.component.js"></script>
      <script src="components/skyvr-high-res-component.js"></script>
      <script src="components/skyvr-starfield-component.js"></script>
      <script src="components/skyvr-cylinder-component.js"></script>
      <script src="components/skyvr-rounded-component.js"></script>
      <script src="components/skyvr-glow-effect-component.js"></script>
      <script src="components/skyvr-control-panel-component.js"></script>
      <script src="components/skyvr-switch-component.js"></script>
      <script src="components/skyvr-rig-follower-component.js"></script>
      <script src="components/skyvr-infobar-component.js"></script>
      <script src="components/skyvr-look-controls-component.js"></script>
      <script src="components/skyvr-tooltip-component.js"></script>
      <script src="components/skyvr-constellation-component.js?v=2"></script>
      <script src="components/skyvr-constellation-pointer-component.js"></script>
      <script src="components/skyvr-networked-components.js?v=2"></script>
      <script src="components/skyvr-offscreen-indicator-component.js"></script>
    </a-assets>

    <a-entity id="sky-master" networked="template:#sky-template;persistent:true;networkId:sky-master;owner:scene"
      sky-state></a-entity>


    <!-- <a-entity light="type: ambient; color: #aaa"></a-entity> -->
    <!-- <a-entity light="type: hemisphere; color: #000; groundcolor: #aaa" position="0 0.01 0"></a-entity> -->

    <!-- <a-ocean width="800" depth="800" density="400" opacity="1" position="0 0 0"></a-ocean> -->

    <!-- Camera with Meta Quest-Controller components and laser-controls -->
    <a-entity id="camera-rig" rig-follower networked="template:#rig-template;attachTemplateToLocal:false;"
      spawn-in-spots="radius:4" position="0 0 0" rotation="0 0 0">
      <a-entity id="camera" player-info networked="template:#camera-template;attachTemplateToLocal:false;"
        camera="near: 0.1; far: 3600" skyvr-look-controls="reverseMouseDrag: true; reverseTouchDrag: false"
        position="0 1.6 0">
        <a-sphere class="head" visible="false" random-color></a-sphere>
      </a-entity>
      <!-- Infobar placed in front of user, visible when looking down -->
      <a-entity id="infobar" skyvr-infobar position="0 0.8 -0.6" rotation="-40 0 0"></a-entity>
      <a-entity id="right-controller" player-info
        networked="template:#right-controller-template;attachTemplateToLocal:false;" meta-touch-controls="hand: right"
        laser-controls haptics raycaster="objects: [data-raycastable]; far: 600; lineOpacity: 0.5;" drawing
        constellation-pointer offscreen-indicator>
        <a-entity light="type: point; intensity: 0.2; distance: 0.5; decay: 1" position="0 0.05 0"></a-entity>
        <!-- Coordinate system for the right controller -->
        <a-entity>
          <!-- X-Axis (Red) -->
          <a-entity line="start: 0 0 0; end: 0.1 0 0; color: red;"></a-entity>
          <!-- Y-Axis (Green) -->
          <a-entity line="start: 0 0 0; end: 0 0.1 0; color: green;"></a-entity>
          <!-- Z-Axis (Blue) -->
          <a-entity line="start: 0 0 0; end: 0 0 0.1; color: blue;"></a-entity>
        </a-entity>
        <!-- Pointer -->
        <a-entity id="pointer" class="pointer" position="-0.0065 -0.0186 -0.05"
          bottom-origin-cylinder="height: 400; radius: 0.009; color: red; rotation: 53.53 8.87 0; opacity: 0.6;"
          visible="false">
        </a-entity>

        <!-- Controller Hints -->
        <a-entity id="hint-trigger" class="controller-hint" position="0 -0.03 -0.05" rotation="-130 0 0">
          <a-rounded width="0.12" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.06 -0.0125 0"></a-rounded>
          <a-text value="Select" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0 0.02 0.03; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-right-joy" class="controller-hint" position="0.04 0.03 -0.01" rotation="-120 0 0">
          <a-rounded width="0.10" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Rotate" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.01 0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-right-grip" class="controller-hint" position="0.06 0 0.08" rotation="-90 90 0">
          <a-rounded width="0.14" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.07 -0.0125 0"></a-rounded>
          <a-text value="Show Pointer" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: -0.02 0 -0.02; end: -0.05 0 -0.05; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-a" class="controller-hint" position="-0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.1" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Remove (A)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-b" class="controller-hint" position="0.02 0.08 0.02" rotation="-120 0 0">
          <a-rounded id="hint-b-bg" width="0.2" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.1 -0.0125 0"></a-rounded>
          <a-text id="hint-b-text" value="Action (B)" width="0.25" align="center" color="white"
            position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.03 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>
      </a-entity>
      <a-entity id="left-controller" player-info meta-touch-controls="hand: left" position="0 0 0">
        <a-entity light="type: point; intensity: 0.2; distance: 0.5; decay: 1" position="0 0.05 0"></a-entity>
        <!-- Controller Hints -->
        <a-entity id="hint-x" class="controller-hint" position="-0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.1" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.05 -0.0125 0"></a-rounded>
          <a-text value="Menu (X)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-y" class="controller-hint" position="0.04 0.05 0.02" rotation="-120 0 0">
          <a-rounded width="0.11" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.055 -0.0125 0"></a-rounded>
          <a-text value="Mode (Y)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: -0.01 -0.02 -0.01; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-grip" class="controller-hint" position="-0.06 0 0.08" rotation="-90 -90 0">
          <a-rounded width="0.13" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.065 -0.0125 0"></a-rounded>
          <a-text value="Talk (Grip)" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0.02 0 -0.02; end: 0.05 0 -0.05; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-entity id="hint-left-joy" class="controller-hint" position="0 0.06 -0.02" rotation="-120 0 0">
          <a-rounded width="0.08" height="0.025" radius="0.005" color="#111" opacity="0.9"
            position="-0.04 -0.0125 0"></a-rounded>
          <a-text value="Time" width="0.25" align="center" color="white" position="0 0 0.001"></a-text>
          <a-entity line="start: 0 0 0; end: 0 -0.02 0.02; color: white; opacity: 0.5"></a-entity>
        </a-entity>

        <a-control-panel id="control-panel-1" enabled="false" height="0.5">
          <a-entity id="latitude-display" position="0 0.22 0"></a-entity>
          <a-entity id="longitude-display" position="0 0.14 0"></a-entity>
          <a-entity id="date-time-display" position="0 0.02 0"></a-entity>

          <!-- buttons on the control panel -->
          <a-entity id="switch-hints"
            switch="position: -0.05 0.21 0; clickActionParam: toggleHints; toggled: true"></a-entity>
          <a-text value="Controller Tooltips" position="-0.03 0.21 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-meridian" switch="position: -0.05 0.18 0; clickActionParam: toggleMeridian"></a-entity>
          <a-text value="Meridian" position="-0.03 0.18 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-equator" switch="position: -0.05 0.15 0; clickActionParam: toggleEquator"></a-entity>
          <a-text value="Equator" position="-0.03 0.15 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-ecliptic" switch="position: -0.05 0.12 0; clickActionParam: toggleEcliptic"></a-entity>
          <a-text value="Ecliptic" position="-0.03 0.12 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-cardinal-points"
            switch="position: -0.05 0.09 0; clickActionParam: toggleCardinalPoints; toggled: true"></a-entity>
          <a-text value="Cardinal Points" position="-0.03 0.09 0" width="0.2" color="white" align="left"></a-text>

          <a-entity id="switch-ncp" switch="position: -0.05 0.06 0; clickActionParam: toggleNCP"></a-entity>
          <a-text value="Celestial Poles" position="-0.03 0.06 0" width="0.2" color="white" align="left"></a-text>

          <!-- Coordinates adjusters -->
          <a-text value="Lat" position="-0.15 0.22 0" width="0.3" color="white" align="left"></a-text>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="-0.06 0.22 0.001" color="#444"
            text="value: -; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('latitude', -0.1)"></a-rounded>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="0.02 0.22 0.001" color="#444"
            text="value: +; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('latitude', 0.1)"></a-rounded>

          <a-text value="Lon" position="-0.15 0.14 0" width="0.3" color="white" align="left"></a-text>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="-0.06 0.14 0.001" color="#444"
            text="value: -; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('longitude', -0.1)"></a-rounded>
          <a-rounded width="0.04" height="0.03" radius="0.01" position="0.02 0.14 0.001" color="#444"
            text="value: +; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="adjustCoordinate('longitude', 0.1)"></a-rounded>

          <!-- Date/Time adjusters -->
          <a-rounded id="now-button" width="0.08" height="0.03" radius="0.01" position="0.09 0.02 0.001" color="#222"
            text="value: NOW; align: center; width: 0.5" class="control-panel-button" data-raycastable
            onclick="setNow()"></a-rounded>

    <script type="text/javascript">
      let latitudeDisplay = document.getElementById("latitude-display");
      let longitudeDisplay = document.getElementById("longitude-display");
      let dateTimeDisplay = document.getElementById("date-time-display");
      let sceneEl = document.querySelector('a-scene');
      let cameraRig = document.getElementById("camera-rig");
      let azContainer = document.getElementById("az-container");
      let eqContainer = document.getElementById("eq-container");
      let precessionContainer = document.getElementById("precession-container");
      let starsPointCloud = document.getElementById("stars-point-cloud");
      let milkyway = document.getElementById("milkyway");

      const initialLatitude = 50.5;
      const initialLongitude = 9.7;
      window.latitude = initialLatitude;
      window.longitude = initialLongitude;
      let elevation = 300;

      function updateInitText() {
        if (!latitudeDisplay) latitudeDisplay = document.getElementById("latitude-display");
        if (latitudeDisplay) {
          latitudeDisplay.setAttribute("text", `value: Latitude: ${latitude.toFixed(1)}; color: white; width: 1; align: center`);
        }
      }
      updateInitText();

      // Initialize a base date/time for the simulation.
      window.simulationTime = luxon.DateTime.now(); // Current local date and time
      console.log(simulationTime.zoneName);

      let observer = new Astronomy.Observer(latitude, longitude, elevation);

      let isRightControllerGripDown = false;
      window.micEnabled = false;

      let lastSyncTime = 0;
      function syncSky(silent = false) {
        // Throttle network updates to ~10Hz unless it's a critical (non-silent) update
        const now = performance.now();
        if (!silent && (now - lastSyncTime < 100)) return;

        const skyMaster = document.getElementById('sky-master');
        if (skyMaster && NAF.connection && NAF.connection.adapter && NAF.connection.isConnected()) {
          const currentState = skyMaster.getAttribute('sky-state') || {};
          const sharedConst = currentState.activeConstellations || 'INIT';

          // ROBUST SAFEGUARD:
          // Use the global helper to check if we are authorized to broadcast.
          if (!window.canUpdateSkyState()) {
            if (!silent) console.warn("syncSky: Not authorized to update yet (waiting for room state).");
            return;
          }

          // Clear any pending initialization timeout once we are ready to broadcast
          if (window.skyInitTimeout) {
            clearTimeout(window.skyInitTimeout);
            window.skyInitTimeout = null;
          }

          if (!NAF.utils.isMine(skyMaster)) {
            console.log("Taking ownership of sky-master to sync state...");
            NAF.utils.takeOwnership(skyMaster);
          }

          const renderer = document.getElementById('constellation-lines')?.components['constellation-renderer'];
          const constellationData = renderer ? JSON.stringify(renderer.placedIllustrations.map(e => e.dataset.constellationId).filter(id => id)) : sharedConst;

          if (!silent) {
            // Only log if it's been a while to avoid console flood during scrubbing
            if (now - lastSyncTime > 1000) {
              console.log("Broadcasting Sky State Update...");
            }
            lastSyncTime = now;
          }

          const updateData = {
            time: simulationTime.toISO(),
            latitude: window.latitude,
            longitude: window.longitude,
            showMeridian: document.getElementById('meridian')?.getAttribute('visible') || false,
            showEquator: document.getElementById('equator')?.getAttribute('visible') || false,
            showEcliptic: document.getElementById('ecliptic')?.getAttribute('visible') || false,
            showCardinalPoints: document.getElementById('cardinal-points')?.getAttribute('visible') || false,
            showCelestialPoles: document.getElementById('ncp')?.getAttribute('visible') || false,
            activeConstellations: constellationData || 'INIT',
            heartbeat: performance.now()
          };

          skyMaster.setAttribute('sky-state', updateData);
        }
      }

      function setNow() {
        simulationTime = luxon.DateTime.now();
        syncSky();
        updateScene();
      }

      // Make sure we have a target time initialized
      window.targetSimulationTime = window.simulationTime;

      // Register a global tick handler for local interpolation
      AFRAME.registerComponent('local-time-interpolator', {
        init: function () {
          this.lerpSpeed = 5.0;
          if (!window.targetSimulationTime && window.simulationTime) {
            window.targetSimulationTime = window.simulationTime;
          }
        },
        tick: function (t, dt) {
          // If we are the owner (or alone), we smoothly interpolate towards our own target
          // If we are a client, the sky-state component handles interpolation from network data.
          const isSolo = new URLSearchParams(window.location.search).get('room') === 'none';
          const skyState = document.getElementById('sky-master');
          const isMine = isSolo || (skyState && NAF.utils.isMine(skyState));

          if (isMine && window.targetSimulationTime && window.simulationTime) {
            const diffSeconds = window.targetSimulationTime.diff(window.simulationTime, 'seconds').seconds;

            // If barely any difference, sync exact and stop
            if (Math.abs(diffSeconds) < 0.01) {
              if (diffSeconds !== 0) {
                window.simulationTime = window.targetSimulationTime;
                updateScene();
                // Broadcast final state
                syncSky();
              }
              return;
            }

            // Huge jump logic (reset/preset)
            if (Math.abs(diffSeconds) > 3600) {
              window.simulationTime = window.targetSimulationTime;
            } else {
              // Smooth Lerp
              const step = diffSeconds * this.lerpSpeed * (dt / 1000);
              window.simulationTime = window.simulationTime.plus({ seconds: step });
            }
            updateScene();

            // CRITICAL: We MUST broadcast the interpolated state if we are moving,
            // otherwise remote clients stop receiving updates the moment joystick stops,
            // missing the "tail" of the glide.
            // We throttle this inside syncSky (100ms) so it's safe to call every frame here.
            syncSky();
          }
        }
      });
      // Attach this component to the scene
      document.querySelector('a-scene').setAttribute('local-time-interpolator', '');

      function adjustTime(unit, amount) {
        window.targetSimulationTime = window.targetSimulationTime.plus({ [unit]: amount });
        // We do NOT call updateScene() here efficiently anymore, the tick loop handles it.
        // But we DO need to broadcast eventual state.
        syncSky();
      }

      function adjustCoordinate(type, amount) {
        if (type === 'latitude') {
          latitude = Math.max(-90, Math.min(90, latitude + amount));
        } else if (type === 'longitude') {
          longitude = longitude + amount;
          // Wrap longitude between -180 and 180
          if (longitude > 180) longitude -= 360;
          if (longitude < -180) longitude += 360;
        }
        syncSky();
        updateScene();
      }

      let lastUIUpdateTime = 0;
      let lastLightUpdateTime = 0;

      // Function to update the scene
      function updateScene() {
        if (!sceneEl) sceneEl = document.querySelector('a-scene');
        if (!cameraRig) cameraRig = document.getElementById("camera-rig");
        if (!azContainer) azContainer = document.getElementById("az-container");
        if (!eqContainer) eqContainer = document.getElementById("eq-container");
        if (!precessionContainer) precessionContainer = document.getElementById("precession-container");
        if (!starsPointCloud) starsPointCloud = document.getElementById("stars-point-cloud");
        if (!milkyway) milkyway = document.getElementById("milkyway");
        if (!latitudeDisplay) latitudeDisplay = document.getElementById("latitude-display");
        if (!longitudeDisplay) longitudeDisplay = document.getElementById("longitude-display");
        if (!dateTimeDisplay) dateTimeDisplay = document.getElementById("date-time-display");

        const jsDate = simulationTime.toJSDate();
        const astroTime = Astronomy.MakeTime(jsDate);
        let lst = calculateLocalSiderealTime(astroTime, longitude);
        let lstDegrees = lst * 15; // Convert LST from hours to degrees

        // Update scene elements based on the new simulation time or latitude
        if (eqContainer) {
          // Use direct Object3D manipulation for better performance
          eqContainer.object3D.rotation.set(
            THREE.MathUtils.degToRad(latitude - 180),
            0,
            THREE.MathUtils.degToRad(lstDegrees - 90)
          );
        }

        let currentYear = simulationTime.year;
        let precessionDegrees = (currentYear - 2000) * 360 / 25750; // Simplified precession effect
        if (precessionContainer) {
          precessionContainer.object3D.rotation.set(
            THREE.MathUtils.degToRad(23.43619),
            0,
            THREE.MathUtils.degToRad(precessionDegrees)
          );
        }

        const now = performance.now();

        // Use persistent variables for Sun caching if they don't exist
        if (!window._skyCache) window._skyCache = { sunAltAz: { altitude: -10, azimuth: 0 }, lastSunUpdateTime: 0 };

        // Ensure observer exists and is up to date
        if (typeof observer === 'undefined' || observer.latitude !== latitude || observer.longitude !== longitude) {
          observer = new Astronomy.Observer(latitude, longitude, elevation);
        }

        const sunRaDec = Astronomy.Equator('Sun', astroTime, observer, false, false);
        window._skyCache.sunAltAz = Astronomy.Horizon(astroTime, observer, sunRaDec.ra, sunRaDec.dec, false);
        const sunAltAz = window._skyCache.sunAltAz;

        const distance = 400;
        const x = -distance * Math.cos((sunAltAz.altitude * Math.PI) / 180) * Math.sin((sunAltAz.azimuth * Math.PI) / 180);
        const y = distance * Math.sin((sunAltAz.altitude * Math.PI) / 180);
        const z = distance * Math.cos((sunAltAz.altitude * Math.PI) / 180) * Math.cos((sunAltAz.azimuth * Math.PI) / 180);

        if (sceneEl) {
          sceneEl.setAttribute('environment', 'lightPosition', `${x} ${y} ${z}`);
        }

        let skyBrightness = mapSunAltitudeToSkyBrightness(sunAltAz.altitude, 0.0);
        if (typeof starShaderMaterial !== 'undefined' && starShaderMaterial.uniforms.skyBrightness) {
          starShaderMaterial.uniforms.skyBrightness.value = skyBrightness;
        }
        if (typeof haloShaderMaterial !== 'undefined' && haloShaderMaterial.uniforms.skyBrightness) {
          haloShaderMaterial.uniforms.skyBrightness.value = skyBrightness;
        }
        if (milkyway) {
          const mwOpacity = mapRange(skyBrightness, 0.0, 0.2, 0.25, 0.0);
          milkyway.setAttribute('material', 'opacity', mwOpacity);
        }

        window._skyCache.lastSunUpdateTime = now;

        // Throttle UI text updates to ~10Hz
        if (now - lastUIUpdateTime > 100) {
          if (dateTimeDisplay) {
            dateTimeDisplay.setAttribute("text", `value: ${simulationTime.toLocaleString(luxon.DateTime.DATETIME_FULL_WITH_SECONDS)}; color: white; width: 0.5; align: center`);
          }

          const latLabel = latitude >= 0 ? "N" : "S";
          if (latitudeDisplay) {
            latitudeDisplay.setAttribute("text", `value: Latitude: ${Math.abs(latitude).toFixed(1)}° ${latLabel}; color: white; width: 1; align: center`);
          }

          const lonLabel = longitude >= 0 ? "O" : "W";
          if (longitudeDisplay) {
            longitudeDisplay.setAttribute("text", `value: Longitude: ${Math.abs(longitude).toFixed(1)}° ${lonLabel}; color: white; width: 1; align: center`);
          }
          lastUIUpdateTime = now;
        }

        if (starsPointCloud && starsPointCloud.components && starsPointCloud.components.starfield) {
          starsPointCloud.components.starfield.update();
        }
      }


      // Debounce function to limit the frequency of updates
      function debounce(func, delay) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func(...args), delay);
        };
      }

      // Wrap updateScene with debounce (adjust delay as necessary)
      const debouncedUpdateScene = debounce(updateScene, 100);  // 100ms delay


      function throttle(func, limit) {
        let inThrottle;
        return function (...args) {
          if (!inThrottle) {
            func(...args);
            inThrottle = true;
            setTimeout(() => (inThrottle = false), limit);
          }
        };
      }

      // Throttle updateScene to run every 30ms
      const throttledUpdateScene = throttle(updateScene, 30);



      // Utility function to map the Sun's altitude to a sky brightness value
      function mapSunAltitudeToSkyBrightness(altitude, lightPollution) {
        // Example mapping, adjust thresholds and brightness levels as needed
        if (altitude > -4.0) {
          // Daytime
          return 1.0; // Maximum brightness
        } else if (altitude > -16.5 && altitude <= -4.0) {
          // Twilight
          return Math.max(lightPollution, 1.3 * (altitude + 16.5) / 16.5); // Gradual decrease
        } else {
          // Nighttime
          return 0.0 + lightPollution; // Minimum brightness for stars visibility
        }
      }


      function mapRange(value, inMin, inMax, outMin, outMax) {
        return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
      }

      //eqContainer.setAttribute('rotation', `${latitude - 180} 0 180`);


      // document.addEventListener('DOMContentLoaded', (event) => {
      //   starsPointCloud.addEventListener('loaded', function() {
      //     updateScene();
      //   });
      // });

      document.addEventListener('DOMContentLoaded', function () {
        const scene = document.querySelector('a-scene');
        if (scene) {
          if (scene.hasLoaded) {
            updateLoadingIndicator('assets', true);
            updateScene();
          } else {
            scene.addEventListener('loaded', function () {
              updateLoadingIndicator('assets', true);
              updateScene();
            });
          }
        }
      });




      // // Event listeners for the reset button
      // const resetButton = document.getElementById("reset-button");
      // resetButton.addEventListener("mouseenter", function () {
      //   resetButton.setAttribute("scale", "1.2 1.2 1");
      // });
      // resetButton.addEventListener("mouseleave", function () {
