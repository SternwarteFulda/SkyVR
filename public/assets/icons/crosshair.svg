<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer brackets -->
  <path d="M 40 20 L 20 20 L 20 40" fill="none" stroke="#00ffff" stroke-width="4" filter="url(#glow)"/>
  <path d="M 160 20 L 180 20 L 180 40" fill="none" stroke="#00ffff" stroke-width="4" filter="url(#glow)"/>
  <path d="M 40 180 L 20 180 L 20 160" fill="none" stroke="#00ffff" stroke-width="4" filter="url(#glow)"/>
  <path d="M 160 180 L 180 180 L 180 160" fill="none" stroke="#00ffff" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Dashed circles -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="10 10" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#0088ff" stroke-width="2" stroke-dasharray="5 5"/>
  
  <!-- Center circle -->
  <!-- Center circle removed -->
  
  <!-- Radial lines -->
  <line x1="100" y1="30" x2="100" y2="45" stroke="#00ffff" stroke-width="2"/>
  <line x1="100" y1="170" x2="100" y2="155" stroke="#00ffff" stroke-width="2"/>
  <line x1="30" y1="100" x2="45" y2="100" stroke="#00ffff" stroke-width="2"/>
  <line x1="170" y1="100" x2="155" y2="100" stroke="#00ffff" stroke-width="2"/>
</svg>
